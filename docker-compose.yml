# docker-compose.yml
# Usage:
#   dev:  docker compose --env-file docker/.env.dev --profile dev up
#   prod: docker compose --env-file docker/.env.prod --profile prod up -d
#
# The env file (from docker/.env.<profile>.example) feeds ${VAR}
# interpolation below; compose does not read docker/ env files on its
# own. Pass it to every command: DPKMS_BUS_TOKEN is required. Both dpkms
# services also need docker/dpkms-auth.yaml (server.auth, from
# docker/dpkms-auth.example.yaml) and docker/dpkms-local.yaml (blob
# storage and providers, from docker/dpkms-local.example.yaml); see
# docs/deployment/docker.md.

name: ctxt

x-dpkms-common: &dpkms-common
  image: ctxt/dpkms:${TAG:-latest}
  restart: unless-stopped
  # No storage / server env: docker/config.docker.yaml (the image's
  # /app/config.yaml) is the single source, and env would override it.
  # The one exception is the non-secret S3 settings below.

# serve's bus hub refuses to start without a token; `up` fails here
# instead when it is unset.
x-dpkms-bus-token: &dpkms-bus-token
  DPKMS_BUS_TOKEN: ${DPKMS_BUS_TOKEN:?set DPKMS_BUS_TOKEN (openssl rand -hex 32), see docs/deployment/docker.md}

# Provider API keys have no config key: providers read them from env.
# They come from the env file; unset ones reach dpkms empty, which reads
# as not set.
x-dpkms-provider-keys: &dpkms-provider-keys
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
  GEMINI_API_KEY: ${GEMINI_API_KEY:-}
  OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}

# Non-secret S3 settings from the env file. Unset ones reach dpkms
# empty, which reads as not set: docker/dpkms-local.yaml keeps its value.
# A set one overrides that file. The S3 access and secret keys are never
# passed here: they stay in docker/dpkms-local.yaml.
x-dpkms-s3-settings: &dpkms-s3-settings
  CTXT_BLOB_S3_ENDPOINT: ${CTXT_BLOB_S3_ENDPOINT:-}
  CTXT_BLOB_S3_REGION: ${CTXT_BLOB_S3_REGION:-}
  CTXT_BLOB_S3_BUCKET: ${CTXT_BLOB_S3_BUCKET:-}
  CTXT_BLOB_S3_PREFIX: ${CTXT_BLOB_S3_PREFIX:-}
  CTXT_BLOB_S3_USE_PATH_STYLE: ${CTXT_BLOB_S3_USE_PATH_STYLE:-}

# The operator's files, read by serve as extra --config layers after the
# image's config (root Dockerfile CMD, docker/air.toml):
#   dpkms-auth   server.auth, which a public instance needs to start
#   dpkms-local  storage.blob and providers; the example changes nothing
x-dpkms-secrets: &dpkms-secrets
  - source: dpkms-auth
    target: dpkms-auth.yaml
  - source: dpkms-local
    target: dpkms-local.yaml

services:

  # ── Base dpkms (prod profile, built image) ──────────────────────────────
  dpkms:
    <<: *dpkms-common
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
      args:
        VERSION: ${VERSION:-dev}
        GIT_COMMIT: ${GIT_COMMIT:-unknown}
        BUILD_TIME: ${BUILD_TIME:-unknown}
    container_name: ctxt-dpkms
    environment:
      <<: [*dpkms-bus-token, *dpkms-provider-keys, *dpkms-s3-settings]
    secrets: *dpkms-secrets
    volumes:
      - ctxt_data:/data
      - ctxt_blobs:/data/blobs
    networks:
      - ctxt
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 3s
      start_period: 15s
      retries: 3
    restart: unless-stopped
    profiles:
      - prod

  # ── Dev dpkms (hot-reload via air) ──────────────────────────────────────
  dpkms-dev:
    # Exact Go patch: mise.toml's go pin, as in the root Dockerfile
    # (scripts/check-toolchain-pins.sh enforces it).
    image: golang:1.26.10-bookworm
    container_name: ctxt-dpkms-dev
    working_dir: /app
    command: >
      sh -c "apt-get update && apt-get install -y --no-install-recommends gcc libc6-dev libsqlite3-dev &&
             go install github.com/air-verse/air@v1.67.4 &&
             air -c docker/air.toml"
    volumes:
      - .:/app
      - go_cache:/root/go/pkg/mod
      - ctxt_dev_data:/data
    ports:
      - "8080:8080"   # HTTP API
      - "9090:9090"   # gRPC
    # Build env plus the bus token, provider keys and non-secret S3
    # settings; other serve settings come from docker/config.docker.yaml
    # and the operator's secrets.
    environment:
      <<: [*dpkms-bus-token, *dpkms-provider-keys, *dpkms-s3-settings]
      CGO_ENABLED: "1"
      GOOS: linux
    secrets: *dpkms-secrets
    networks:
      - ctxt
    profiles:
      - dev

  # ── Vite dev server ──────────────────────────────────────────────────────
  ui-dev:
    # Must equal the mise.toml node pin, like every Node version in the repo.
    # Every image here names an exact release (scripts/check-toolchain-pins.sh
    # enforces both).
    image: node:22.23.3-alpine3.24
    container_name: ctxt-ui-dev
    working_dir: /app/web/ui
    command: >
      sh -c "corepack enable &&
             ([ -f pnpm-lock.yaml ] && pnpm install || npm install) &&
             ([ -f pnpm-lock.yaml ] && pnpm dev --host 0.0.0.0 ||
              npm run dev -- --host 0.0.0.0)"
    volumes:
      - ./web/ui:/app/web/ui
      - node_modules:/app/web/ui/node_modules
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://dpkms-dev:8080
    networks:
      - ctxt
    profiles:
      - dev

  # ── Caddy reverse proxy (prod only) ─────────────────────────────────────
  caddy:
    image: caddy:2.11.4-alpine
    container_name: ctxt-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./docker/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    environment:
      DOMAIN: ${DOMAIN:-localhost}
      ACME_EMAIL: ${ACME_EMAIL:-admin@example.com}
    depends_on:
      dpkms:
        condition: service_healthy
    networks:
      - ctxt
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:80"]
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 3
    profiles:
      - prod

secrets:
  dpkms-auth:
    file: ./docker/dpkms-auth.yaml
  dpkms-local:
    file: ./docker/dpkms-local.yaml

volumes:
  ctxt_data:
    name: ctxt_data
  ctxt_blobs:
    name: ctxt_blobs
  ctxt_dev_data:
    name: ctxt_dev_data
  caddy_data:
    name: caddy_data
  caddy_config:
    name: caddy_config
  go_cache:
    name: ctxt_go_cache
  node_modules:
    name: ctxt_node_modules

networks:
  ctxt:
    name: ctxt
    driver: bridge
