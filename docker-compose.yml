# docker-compose.yml
# Usage:
#   dev:  docker compose --profile dev up
#   prod: docker compose --profile prod up -d
#
# Both dpkms services need docker/dpkms-auth.yaml (server.auth, from
# docker/dpkms-auth.example.yaml) and DPKMS_BUS_TOKEN set; see
# docs/deployment/docker.md.

name: ctxt

x-dpkms-common: &dpkms-common
  image: ctxt/dpkms:${TAG:-latest}
  restart: unless-stopped
  # No storage / server env: docker/config.docker.yaml (the image's
  # /app/config.yaml) is the single source, and env would override it.

# serve's bus hub refuses to start without a token; `up` fails here
# instead when it is unset.
x-dpkms-bus-token: &dpkms-bus-token
  DPKMS_BUS_TOKEN: ${DPKMS_BUS_TOKEN:?set DPKMS_BUS_TOKEN (openssl rand -hex 32), see docs/deployment/docker.md}

# server.auth, which a public instance needs to start. The file is the
# operator's; serve reads it as a second --config (root Dockerfile CMD,
# docker/air.toml).
x-dpkms-auth-secret: &dpkms-auth-secret
  - source: dpkms-auth
    target: dpkms-auth.yaml

services:

  # ── Base dpkms (prod profile, built image) ──────────────────────────────
  dpkms:
    <<: *dpkms-common
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
      args:
        VERSION: ${VERSION:-dev}
        GIT_COMMIT: ${GIT_COMMIT:-unknown}
        BUILD_TIME: ${BUILD_TIME:-unknown}
    container_name: ctxt-dpkms
    environment: *dpkms-bus-token
    secrets: *dpkms-auth-secret
    volumes:
      - ctxt_data:/data
      - ctxt_blobs:/data/blobs
    networks:
      - ctxt
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 3s
      start_period: 15s
      retries: 3
    restart: unless-stopped
    profiles:
      - prod

  # ── Dev dpkms (hot-reload via air) ──────────────────────────────────────
  dpkms-dev:
    image: golang:1.26-bookworm
    container_name: ctxt-dpkms-dev
    working_dir: /app
    command: >
      sh -c "apt-get update && apt-get install -y --no-install-recommends gcc libc6-dev libsqlite3-dev &&
             go install github.com/air-verse/air@latest &&
             air -c docker/air.toml"
    volumes:
      - .:/app
      - go_cache:/root/go/pkg/mod
      - ctxt_dev_data:/data
    ports:
      - "8080:8080"   # HTTP API
      - "9090:9090"   # gRPC
    # Build env plus the bus token; serve settings come from
    # docker/config.docker.yaml and the auth secret.
    environment:
      <<: *dpkms-bus-token
      CGO_ENABLED: "1"
      GOOS: linux
    secrets: *dpkms-auth-secret
    networks:
      - ctxt
    profiles:
      - dev

  # ── Vite dev server ──────────────────────────────────────────────────────
  ui-dev:
    image: node:22-alpine
    container_name: ctxt-ui-dev
    working_dir: /app/web/ui
    command: >
      sh -c "corepack enable &&
             ([ -f pnpm-lock.yaml ] && pnpm install || npm install) &&
             ([ -f pnpm-lock.yaml ] && pnpm dev --host 0.0.0.0 ||
              npm run dev -- --host 0.0.0.0)"
    volumes:
      - ./web/ui:/app/web/ui
      - node_modules:/app/web/ui/node_modules
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://dpkms-dev:8080
    networks:
      - ctxt
    profiles:
      - dev

  # ── Caddy reverse proxy (prod only) ─────────────────────────────────────
  caddy:
    image: caddy:2-alpine
    container_name: ctxt-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./docker/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    depends_on:
      dpkms:
        condition: service_healthy
    networks:
      - ctxt
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:80"]
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 3
    profiles:
      - prod

secrets:
  dpkms-auth:
    file: ./docker/dpkms-auth.yaml

volumes:
  ctxt_data:
    name: ctxt_data
  ctxt_blobs:
    name: ctxt_blobs
  ctxt_dev_data:
    name: ctxt_dev_data
  caddy_data:
    name: caddy_data
  caddy_config:
    name: caddy_config
  go_cache:
    name: ctxt_go_cache
  node_modules:
    name: ctxt_node_modules

networks:
  ctxt:
    name: ctxt
    driver: bridge
