# Gitleaks Configuration for ContextHelp
# https://github.com/gitleaks/gitleaks

title = "ContextHelp Gitleaks Configuration"

# extend section is at end of file

#############################################################################
# Custom Rules for ContextHelp
#
# These run alongside gitleaks' default rules ([extend] useDefault below).
# Every custom id carries the ctxt- prefix so it never equals a default rule
# id: gitleaks treats a same-id rule as an override of the default one,
# keeping the default's keywords and allowlists. The default openai-api-key
# keyword ("t3blbkfj") then gated this file's sk-proj- regex, so it never
# matched, and this file's narrower regexes replaced the default
# generic-api-key and private-key detectors.
#############################################################################

[[rules]]
id = "ctxt-openai-api-key"
description = "OpenAI API Key"
regex = '''sk-proj-[a-zA-Z0-9]{32,}'''
tags = ["api-key", "openai"]

[[rules]]
id = "ctxt-openai-legacy-key"
description = "OpenAI Legacy API Key"
regex = '''sk-[a-zA-Z0-9]{48}'''
tags = ["api-key", "openai", "legacy"]

[[rules]]
id = "ctxt-anthropic-api-key"
description = "Anthropic API Key"
regex = '''sk-ant-[a-zA-Z0-9-]{95}'''
tags = ["api-key", "anthropic"]

[[rules]]
id = "ctxt-generic-api-key"
description = "Generic API Key"
regex = '''(?i)api[_-]?key\s*[:=]\s*['"][a-zA-Z0-9_\-]{20,}['"]'''
tags = ["api-key", "generic"]

[[rules]]
id = "ctxt-generic-secret"
description = "Generic Secret"
regex = '''(?i)secret\s*[:=]\s*['"][a-zA-Z0-9_\-]{20,}['"]'''
tags = ["secret"]

[[rules]]
id = "ctxt-password-assignment"
description = "Password in variable assignment"
regex = '''(?i)(password|passwd|pwd)\s*[:=]\s*['"][^'"\s]{8,}['"]'''
tags = ["password"]

[[rules]]
id = "ctxt-jwt-token"
description = "JWT Token"
regex = '''eyJ[a-zA-Z0-9_-]*\.eyJ[a-zA-Z0-9_-]*\.[a-zA-Z0-9_-]*'''
tags = ["jwt", "token"]

[[rules]]
id = "ctxt-github-token"
description = "GitHub Token"
regex = '''gh[pousr]_[a-zA-Z0-9]{36}'''
tags = ["github", "token"]

[[rules]]
id = "ctxt-aws-access-key"
description = "AWS Access Key ID"
regex = '''AKIA[0-9A-Z]{16}'''
tags = ["aws", "access-key"]

[[rules]]
id = "ctxt-aws-secret-key"
description = "AWS Secret Access Key"
regex = '''(?i)aws[_-]?secret[_-]?access[_-]?key\s*[:=]\s*['"][a-zA-Z0-9/+=]{40}['"]'''
tags = ["aws", "secret-key"]

[[rules]]
id = "ctxt-slack-webhook"
description = "Slack Webhook URL"
regex = '''https://hooks\.slack\.com/services/[A-Z0-9]{9,}/[A-Z0-9]{9,}/[a-zA-Z0-9]{24}'''
tags = ["slack", "webhook"]

[[rules]]
id = "ctxt-postgres-connection-string"
description = "PostgreSQL Connection String with Password"
regex = '''postgres(?:ql)?://[^:]+:[^@]+@[^/]+/[^\s'"]+'''
tags = ["database", "postgres", "connection-string"]

[[rules]]
id = "ctxt-private-key"
description = "Private Key"
regex = '''-----BEGIN\s+(?:RSA|DSA|EC|OPENSSH)\s+PRIVATE\s+KEY-----'''
tags = ["private-key", "crypto"]

[[rules]]
id = "ctxt-basic-auth"
description = "Basic Authentication Header"
regex = '''(?i)authorization\s*[:=]\s*['"]basic\s+[a-zA-Z0-9+/=]{20,}['"]'''
tags = ["auth", "basic-auth"]

[[rules]]
id = "ctxt-bearer-token"
description = "Bearer Token"
regex = '''(?i)authorization\s*[:=]\s*['"]bearer\s+[a-zA-Z0-9_\-\.]{20,}['"]'''
tags = ["auth", "bearer-token"]

[[rules]]
id = "ctxt-env-var-assignment"
description = "Environment Variable with Secret"
regex = '''(?i)(api[_-]?key|secret|password|token)\s*=\s*[a-zA-Z0-9_\-]{20,}'''
tags = ["env-var"]

#############################################################################
# CTXT-Specific Rules
#############################################################################

[[rules]]
id = "ctxt-api-key"
description = "CTXT API Key"
regex = '''CTXT_API_KEY\s*[:=]\s*['"]?[a-zA-Z0-9_\-]{20,}['"]?'''
tags = ["ctxt", "api-key"]

[[rules]]
id = "ctxt-secret"
description = "CTXT Secret or Token"
regex = '''CTXT_(SECRET|TOKEN|PASSWORD|AUTH_TOKEN|SIGNING_KEY)\s*[:=]\s*['"]?[a-zA-Z0-9_\-\.]{16,}['"]?'''
tags = ["ctxt", "secret"]

[[rules]]
id = "ctxt-db-dsn"
description = "CTXT Database DSN with credentials"
regex = '''CTXT_DB(?:_DSN|_URL|_PASSWORD|_PASS)\s*[:=]\s*['"]?[^\s'"]{8,}['"]?'''
tags = ["ctxt", "database"]

[[rules]]
id = "ctxt-provider-key"
description = "CTXT provider API key variable"
regex = '''CTXT_[A-Z0-9_]+_(?:API_KEY|SECRET|TOKEN)\s*[:=]\s*['"]?[a-zA-Z0-9_\-]{16,}['"]?'''
tags = ["ctxt", "provider", "api-key"]

#############################################################################
# Allowlist - Files and Patterns to Ignore
#############################################################################

# [[allowlists]] is the 8.25+ form of the deprecated [allowlist] table.
[[allowlists]]
description = "Allowlisted files and patterns"

# Allow example files (they don't contain real secrets)
paths = [
  '''.env.example$''',
  '''config\.example\.yaml$''',
  '''config\.minimal\.yaml$''',
  '''config\.plugins\.yaml$''',
  '''config\.leann\.yaml$''',
  '''testdata/''',
  '''docs/''',
  '''\.md$''',
]

# Allow specific patterns that are false positives
regexes = [
  # Allow ${VAR_NAME} syntax in config files
  '''\$\{[A-Z_]+\}''',

  # Allow placeholder values
  '''(your|my|example|test|demo|sample)[_-]?(key|token|secret|password)''',

  # Allow "sk-" prefix documentation
  '''sk-proj-\.\.\.''',
  '''sk-ant-\.\.\.''',
  '''sk-\.\.\.''',

  # No length-only patterns: a regex like ^[a-zA-Z0-9+/=]{8,20}$ matches
  # every AWS access key id (AKIA + 16 chars) and any short token.

  # Allow common test/placeholder passwords
  '''(password|secret|token|key)[:=]\s*['"]?(test|example|placeholder|changeme|dummy)['"]?''',

  # Allow CTXT_* env vars that reference other env vars or are empty/placeholder
  '''CTXT_[A-Z0-9_]+=\s*["']?\$\{?[A-Z_]+\}?["']?''',
  '''CTXT_[A-Z0-9_]+=\s*["']?(your|my|example|test|demo|changeme|<[^>]+>|)["']?$''',
]

# Commits to exclude from scanning (if any)
commits = []

# Stop words: a finding whose secret contains one (case-insensitive) is
# skipped. Keep them to words a random key is unlikely to contain; "my"
# appears in about 1 in 70 random AWS key ids.
stopwords = [
  "example",
  "test",
  "demo",
  "sample",
  "placeholder",
  "changeme",
  "your",
]

#############################################################################
# Global Settings
#############################################################################

[extend]
useDefault = true
