# Pre-commit hooks mirroring the CI lint gate (.github/workflows/ci.yml).
#
# INSTALL:
#   make install-hooks
#
# Do NOT run `pre-commit install`: it refuses to run while core.hooksPath is
# set, and this repo sets it to .githooks for the gitleaks scan. Instead
# .githooks/pre-commit chains to `pre-commit hook-impl` after that scan, so
# both gates run from a single hook.
#
# ─── Scoping: why these hooks are not repo-wide ──────────────────────────────
#
# The repo is at zero golangci findings at the pinned version, and CI runs the
# blocking full scan. The hooks exist for a fast local loop, so each one is
# scoped to what you are actually committing:
#   - gofmt / go vet   — run against the staged files (pre-commit passes them)
#   - golangci-lint    — staged packages, filtered by --new-from-rev=HEAD so
#                        only findings YOUR diff introduces fail the commit
#
# Net effect: a commit is checked in seconds; CI checks the whole tree.
#
# Bypass once (sparingly): git commit --no-verify
# Check the whole repo on demand: pre-commit run --all-files

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-yaml
        # Compose and workflow files use YAML features the default parser
        # rejects; they are covered by actionlint and compose config below.
        exclude: ^(docker-compose.*\.yml|\.github/workflows/.*)$
      - id: end-of-file-fixer
        # Conformance captures are recorded stdout/stderr bytes, asserted on
        # verbatim by the grading service. Normalizing them rewrites evidence.
        # Generated viewer and web UI bundles (whitespace inside template
        # literals is content; drift gates compare them byte for byte) and
        # vendored XML schemas (byte-identical to upstream).
        exclude: ^(e2e/conformance/cassettes/|internal/searchgraph/viewer/dist/|internal/ui/dist/|internal/searchgraph/testdata/schemas/)
      - id: trailing-whitespace
        # Same: kit's error blocks are space-padded, and stripping that
        # padding corrupts the capture (see e2e/conformance/README.md).
        exclude: ^(e2e/conformance/cassettes/|internal/searchgraph/viewer/dist/|internal/ui/dist/|internal/searchgraph/testdata/schemas/)
      - id: check-executables-have-shebangs
      - id: check-shebang-scripts-are-executable
      - id: check-merge-conflict

  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.7
    hooks:
      - id: actionlint

  - repo: local
    hooks:
      # CI fails when `gofmt -l .` prints anything. Scoped here to the staged
      # files so the pre-existing backlog stays out of your way.
      - id: gofmt
        name: gofmt (staged files)
        entry: scripts/hooks/gofmt-staged.sh
        language: script
        types: [go]

      # CI runs `go vet -tags fts5 ./...`. Vet analyses whole packages, so the
      # hook maps the staged files to their packages.
      - id: go-vet
        name: go vet (staged packages)
        entry: scripts/hooks/go-vet-staged.sh
        language: script
        types: [go]
        pass_filenames: true
        require_serial: true

      # CI runs golangci-lint at the pinned version over the whole tree.
      # --new-from-rev=HEAD means only findings introduced by this commit
      # fail the hook.
      - id: golangci-lint
        name: golangci-lint (new findings only)
        entry: scripts/hooks/golangci-staged.sh
        language: script
        types: [go]
        pass_filenames: true
        require_serial: true
