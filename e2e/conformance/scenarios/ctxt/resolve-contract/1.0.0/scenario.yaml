schema_version: "1"
scenario_id: resolve-contract
description: >-
  The resolver fails legibly. A missing object ref, a missing entity
  slug, and an undefined flag each yield a structured, corrective error
  envelope carrying a stable code, the failing input echoed back, and a
  named recovery command — and each exits in the class that matches the
  failure, so an agent can tell "absent" apart from "malformed request"
  without parsing prose.
binary: ctxt
factor_coverage: [3, 4, 11]
tier: 3
story_ref:
  story_id: ctxt.conformance.resolve-contract
  story_path: stories/resolve-contract.yaml
  content_hash: "sha256:0cddab1ee346ae3184bf1048441f5fae1e024cd2b4fd0162f483e5009504744a"
steps:
  - id: unknown_ref
    invoke: ["ctxt", "resolve", "obj_deadbeef", "--format", "json"]
    capture: [exit_code, stdout, stderr]
  - id: unknown_entity
    invoke: ["ctxt", "resolve", "@nonexistent.slug", "--format", "json"]
    capture: [exit_code, stdout, stderr]
  - id: unknown_flag
    invoke: ["ctxt", "resolve", "obj_deadbeef", "--bogus-flag"]
    capture: [exit_code, stdout, stderr]
assertions:
  # ── F4: the envelope is machine-readable and corrective ──────────
  # A caller that asked for --format json is owed a keyed envelope on
  # failure too, not human-rendered prose it has to regex.
  - id: missing-object-envelope-has-code
    kind: stderr_contains
    on: unknown_ref
    factor: 4
    value: '"code"'
  - id: missing-object-envelope-offers-correction
    kind: stderr_contains
    on: unknown_ref
    factor: 4
    value: '"suggested_fix"'
  # Echoing the failing ref lets a batch caller attribute the failure to
  # one input without correlating by position.
  - id: missing-object-echoes-ref
    kind: stderr_contains
    on: unknown_ref
    factor: 4
    value: "obj_deadbeef"
  # Naming the recovery command is what makes the error corrective
  # rather than merely descriptive.
  - id: missing-object-names-recovery
    kind: stderr_contains
    on: unknown_ref
    factor: 4
    value: "ctxt find"
  - id: missing-entity-envelope-has-code
    kind: stderr_contains
    on: unknown_entity
    factor: 4
    value: '"code"'
  - id: missing-entity-echoes-slug
    kind: stderr_contains
    on: unknown_entity
    factor: 4
    value: "nonexistent.slug"
  # A rejected flag must point at the failing leaf's own help, so the
  # caller reads the surface it actually invoked.
  - id: unknown-flag-correction-hint
    kind: stderr_contains
    on: unknown_flag
    factor: 4
    value: "--help"
  - id: unknown-flag-echoes-flag
    kind: stderr_contains
    on: unknown_flag
    factor: 4
    value: "bogus-flag"

  # ── F3: stream discipline holds on the failure path ──────────────
  # stdout carries data or nothing; diagnostics go to stderr. A failed
  # resolve must not leave half a document on stdout for a pipe to eat.
  #
  # Asserted on the usage failure only, deliberately.
  #
  # stream_discipline_pass fails ANY stderr it can parse as JSON. The
  # two missing-ref steps run under --format json and answer with
  # kit's structured error envelope on stderr, which is what the spec
  # requires: "Machine-readable diagnostics, including structured
  # errors and warnings, MUST be written to stderr" (12fcc v0.1,
  # Channel discipline). Asserting the verb on them would mark the
  # leaf non-conformant for obeying the spec, and the only way to
  # turn it green would be to drop the envelope — taking the machine-
  # readable `code`, `exit_code` and `suggested_fix` with it, which
  # the stderr_contains assertions above exist to pin.
  #
  # unknown_flag is a different case and keeps the assertion: a usage
  # error is raised before format negotiation, so its stderr is prose
  # under every --format and the verb reads it correctly.
  #
  #
  # Measured, not inferred: a build that printed a JSON object to
  # stdout on this very step graded IDENTICALLY to the clean build
  # under the old assertions — both reported "stderr is JSON-
  # parseable". The verb fails on the stderr rule before it can say
  # anything about stdout, so those assertions never detected the
  # leak they were written to catch. Removing them loses no coverage;
  # the coverage was already absent.
  # The part these steps still need — stdout empty, so a pipe gets
  # nothing rather than half a document — has no verb to express it.
  # Their stdout.txt captures are 0 bytes, and that is the evidence
  # until a stdout-is-empty verb lands upstream.
  - id: unknown-flag-stream-discipline
    kind: stream_discipline_pass
    on: unknown_flag
    factor: 3

  # ── F11: exit codes carry class, not just failure ────────────────
  # An absent ref is NOT_FOUND; a flag the parser rejects is USAGE.
  # Collapsing both to 1 forces the caller back to prose parsing.
  - id: missing-object-not-found-class
    kind: exit_code_class
    on: unknown_ref
    factor: 11
    classes: [NOT_FOUND]
  - id: missing-entity-not-found-class
    kind: exit_code_class
    on: unknown_entity
    factor: 11
    classes: [NOT_FOUND]
  - id: unknown-flag-usage-class
    kind: exit_code_class
    on: unknown_flag
    factor: 11
    classes: [USAGE]
