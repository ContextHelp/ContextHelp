# yaml-language-server: $schema=https://raw.githubusercontent.com/hop-top/kit/main/contracts/story-schema.json
schema_version: "1"
story_id: ctxt.compose.export-object
title: Export one object as JSON or YAML
binary: ctxt
intent: |
  The agent hands a single note to an external tool. It exports the object
  with no format named, which prints it as JSON, then asks for the JSON
  envelope explicitly, then for YAML.
steps:
  - id: plain
    intent: Export with no format named, which prints JSON.
    invoke: ["ctxt", "export", "obj_12345678"]
    capture: [exit_code, stdout]
  - id: json_envelope
    intent: Ask for the JSON envelope explicitly rather than by omission.
    invoke: ["ctxt", "export", "obj_12345678", "--format", "json"]
    capture: [exit_code, stdout]
  - id: yaml
    intent: Export the same object as YAML.
    invoke: ["ctxt", "export", "obj_12345678", "--format", "yaml"]
    capture: [exit_code, stdout]
