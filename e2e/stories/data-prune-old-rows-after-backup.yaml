# yaml-language-server: $schema=https://raw.githubusercontent.com/hop-top/kit/main/contracts/story-schema.json
schema_version: "1"
story_id: dpkms.data.prune-old-rows-after-backup
title: Take a safety backup before pruning data past a retention date
binary: dpkms
intent: |
  An operator enforcing a retention window is about to remove old data
  permanently. They take a backup first so the removal is recoverable,
  prune everything before the cutoff, then compact the file so the space
  is actually returned.
steps:
  - id: safety_backup
    intent: Capture a restorable archive before removing anything.
    invoke: ["dpkms", "backup", "--include-blobs", "--format", "json"]
    capture: [exit_code, stdout]
  - id: prune_before_cutoff
    intent: Remove data older than the retention cutoff date.
    invoke: ["dpkms", "housekeeping", "prune", "--before", "2024-01-01", "--format", "json"]
    capture: [exit_code, stdout, stderr]
  - id: compact_file
    intent: Compact the database file so pruned space is released.
    invoke: ["dpkms", "housekeeping", "compact", "--format", "json"]
    capture: [exit_code, stdout]
