# yaml-language-server: $schema=https://raw.githubusercontent.com/hop-top/kit/main/contracts/story-schema.json
schema_version: "1"
story_id: dpkms.config.lint-registry-and-gen-docs
title: Lint a registry file and regenerate the CLI reference before publishing
binary: dpkms
intent: |
  A developer publishing a registry lints the registry file against its
  schema, then regenerates the CLI reference docs so the documented
  surface comes from the real command tree rather than by hand.
steps:
  - id: lint_registry
    intent: Lint the registry YAML against its schema before publishing.
    invoke: ["dpkms", "dev", "validate-registry", "registry.yaml", "--format", "json"]
    capture: [exit_code, stdout, stderr]
  - id: regenerate_docs
    intent: Regenerate CLI reference docs from the live command tree.
    invoke: ["dpkms", "dev", "gen-docs", "--dir", "docs/cli"]
    capture: [exit_code, stdout]
