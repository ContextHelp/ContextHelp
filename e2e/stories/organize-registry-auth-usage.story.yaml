# yaml-language-server: $schema=https://raw.githubusercontent.com/hop-top/kit/main/contracts/story-schema.json
schema_version: "1"
story_id: ctxt.organize.registry-auth-and-metering
title: Authenticate to a paid registry, check entitlements and usage, then sign out
binary: ctxt
intent: |
  An operator on a metered registry stores their token in the OS keychain
  rather than a config file, checks what their entitlements actually cover
  and how much of the quota they have burned before running a large sync,
  and removes the credential when done.
steps:
  - id: login
    intent: Store the registry auth token in the OS keychain.
    invoke: ["ctxt", "registry", "login", "uxpatterns", "--format", "json"]
    capture: [exit_code, stdout, stderr]
  - id: entitlements
    intent: Check which entitlements are active across subscribed registries.
    invoke: ["ctxt", "registry", "entitlements", "--format", "json"]
    capture: [exit_code, stdout, stderr]
  - id: usage
    intent: Check metered usage before running a large sync.
    invoke: ["ctxt", "registry", "usage", "uxpatterns", "--format", "json"]
    capture: [exit_code, stdout, stderr]
  - id: reconcile
    intent: Sync every configured registry with multi-registry reconciliation.
    invoke: ["ctxt", "registry", "sync", "uxpatterns", "--reconcile", "--format", "json"]
    capture: [exit_code, stdout, stderr]
  - id: logout
    intent: Remove the stored credential from the keychain.
    invoke: ["ctxt", "registry", "logout", "uxpatterns", "--format", "json"]
    capture: [exit_code, stdout, stderr]
