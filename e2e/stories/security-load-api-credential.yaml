# yaml-language-server: $schema=https://raw.githubusercontent.com/hop-top/kit/main/contracts/story-schema.json
schema_version: "1"
story_id: dpkms.security.load-api-credential
title: Load a provider credential from a file without it reaching shell history
binary: dpkms
intent: |
  A pipeline step needs a provider API key. The operator checks which
  secrets backend is active, writes the value in from a file rather than
  as an argument, confirms it reads back, and restarts the daemon so the
  worker picks it up.
steps:
  - id: check_backend
    intent: Show which secrets backend is currently configured.
    invoke: ["dpkms", "secret", "list", "--format", "json"]
    capture: [exit_code, stdout]
  - id: write_secret
    intent: Store the credential by reading it from a file, never an argument.
    invoke: ["dpkms", "secret", "set", "OPENAI_API_KEY", "--from-file", "secrets/openai.key"]
    capture: [exit_code, stdout, stderr]
  - id: read_back
    intent: Read the secret back to confirm the backend accepted it.
    invoke: ["dpkms", "secret", "get", "OPENAI_API_KEY"]
    capture: [exit_code, stdout]
  - id: restart_worker
    intent: Restart the instance so workers pick up the new credential.
    invoke: ["dpkms", "reboot", "--port", "8080"]
    capture: [exit_code, stdout, stderr]
