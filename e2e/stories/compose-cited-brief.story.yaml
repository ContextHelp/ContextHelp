# yaml-language-server: $schema=https://raw.githubusercontent.com/hop-top/kit/main/contracts/story-schema.json
schema_version: "1"
story_id: ctxt.compose.cited-brief
title: Compose a brief and get its citations back as structured data
binary: ctxt
intent: |
  An agent asked for a written brief hands back sources, not just
  prose. It composes the brief over a tag slice, takes the JSON export so
  the citations arrive as structured records rather than inline markers,
  then resolves one cited reference to confirm the citation points at a
  real object before passing the brief on.
steps:
  - id: markdown
    intent: Compose the brief as markdown with inline citations.
    invoke: ["ctxt", "compose", "brief", "--tagged", "ux,onboarding"]
    capture: [exit_code, stdout]
  - id: structured
    intent: Take the same brief as JSON so citations come back structured.
    invoke: ["ctxt", "compose", "brief", "--tagged", "ux,onboarding", "--export", "json"]
    capture: [exit_code, stdout]
  - id: verify_citation
    intent: Resolve one cited reference to confirm it exists.
    invoke: ["ctxt", "resolve", "obj_12345678", "--format", "json"]
    capture: [exit_code, stdout]
