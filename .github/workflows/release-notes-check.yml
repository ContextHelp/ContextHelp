name: Release Notes Check

# Per ADR-070: every PR with an operator-impacting change must declare its
# bucket via the `Operator-Impact:` commit trailer AND have a matching row in
# the release-notes file at docs/release-notes/<release-date>.md.
#
# This check fails the PR if any commit in the diff carries a non-`none`
# Operator-Impact trailer without a corresponding release-notes entry.

on:
  pull_request:
    branches:
      - main
      - next
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  release-notes:
    name: Verify operator-impact declarations
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Verify Operator-Impact trailer + release-notes entry
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        # SHA values are hex-only (validated by GitHub); env vars keep them out
        # of the script text. The same check runs locally: make check-operator-impact.
        run: scripts/ci/check-operator-impact.sh "$BASE_SHA" "$HEAD_SHA"
