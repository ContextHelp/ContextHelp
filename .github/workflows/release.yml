name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/ctxt-dpkms

jobs:
  # ── Gate 1: everything CI runs ───────────────────────────────────────────────
  # ci.yml in full, as a reusable workflow, on the tagged commit: toolchain
  # pin check, secret scan, lint, security, unit + e2e tests on Linux and
  # macOS, viewer and web UI bundle drift, integration on Postgres, build.
  # A release gates on exactly what a merge gates on, with no second copy
  # of those jobs to drift. scripts/check-toolchain-pins.sh fails when this
  # job is gone or any other job here can start before it passes.
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
      # ci.yml's security job uploads gosec and Trivy SARIF; upload-sarif
      # also reads the workflow run. A called job gets no permission the
      # caller withholds.
      security-events: write
      actions: read

  # ── Gate 2: Trivy CRITICAL scans (Dockerfile + filesystem) ──────────────────
  # Release-only and stricter than CI's Trivy step, which uploads SARIF
  # without failing: a CRITICAL finding blocks the tag.
  trivy-release-gate:
    needs: ci
    name: Trivy Release Gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Trivy config scan — Dockerfile misconfigs (block on CRITICAL)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: Dockerfile
          format: table
          exit-code: '1'
          severity: CRITICAL

      - name: Trivy filesystem scan — source CVEs (block on CRITICAL)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: table
          exit-code: '1'
          severity: CRITICAL
          ignore-unfixed: true

  # ── GoReleaser: publish only after full gate passes ──────────────────────────
  goreleaser:
    name: GoReleaser
    runs-on: ubuntu-latest
    needs: [ci, trivy-release-gate]
    env:
      # secrets context is unavailable in step-level `if`; surface presence via job env
      HAS_GPG: ${{ secrets.GPG_PRIVATE_KEY != '' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ needs.ci.outputs.go-version }}
          cache: true

      - name: Install mingw-w64 (Windows CGO cross-compilation)
        run: sudo apt-get install -y gcc-mingw-w64-x86-64 g++-mingw-w64-x86-64

      - name: Import GPG key (optional — skip if secret absent)
        id: import_gpg
        if: env.HAS_GPG == 'true'
        uses: crazy-max/ghaction-import-gpg@v7
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}

      # Version from mise.toml, via ci.yml's toolchain job. OSS GoReleaser
      # has no per-sign condition (signs[].if is Pro-only), so without a GPG
      # key the sign pipe is skipped here rather than in .goreleaser.yaml.
      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          version: v${{ needs.ci.outputs.goreleaser-version }}
          args: release --clean${{ env.HAS_GPG != 'true' && ' --skip=sign' || '' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
          GPG_FINGERPRINT: ${{ steps.import_gpg.outputs.fingerprint }}
