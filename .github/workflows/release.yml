name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/ctxt-dpkms
  GO_VERSION: '1.26'

jobs:
  # ── Gate 1: secret scan ──────────────────────────────────────────────────────
  # ── DISABLED: secret scanning runs locally ───────────────────────────────
  # gitleaks-action requires a license for organization-owned repos and this
  # repo is org-owned, so the job fails with "missing gitleaks license"
  # before scanning anything. Until a GITLEAKS_LICENSE secret exists, secret
  # scanning runs locally instead: `make install-hooks` wires a pre-commit
  # hook, `make secret-scan-local` scans the working tree.
  #
  # To re-enable: obtain a free key at gitleaks.io, add it as the
  # GITLEAKS_LICENSE secret, uncomment this job, and restore secret-scan to
  # the build job's needs list.
  # secret-scan:
  #   name: Secret Scanning (gitleaks)
  #   runs-on: ubuntu-latest
  #   permissions:
  #     contents: read
  #   steps:
  #     - name: Checkout code
  #       uses: actions/checkout@v7
  #       with:
  #         fetch-depth: 0
  #
  #     - name: Run gitleaks
  #       uses: gitleaks/gitleaks-action@v3
  #       env:
  #         GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  #         # Organization-owned repos need a (free) gitleaks license; personal
  #         # accounts do not. This repo moved to the ContextHelp org, so the
  #         # scan started failing with "missing gitleaks license". Obtain one
  #         # at gitleaks.io and store it as the GITLEAKS_LICENSE secret.
  #         GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
  #
  # # ── Gate 2: lint ─────────────────────────────────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Install golangci-lint
        run: |
          curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/master/install.sh \
            | sh -s -- -b "$(go env GOPATH)/bin" v1.55.2

      - name: Run golangci-lint
        run: golangci-lint run --timeout=5m --verbose

      - name: Check formatting
        run: |
          if [ -n "$(gofmt -l .)" ]; then
            echo "Go code is not formatted. Run: gofmt -w ."
            gofmt -d .
            exit 1
          fi

      - name: Run go vet
        run: go vet -tags fts5 ./...

  # ── Gate 3: security scan ────────────────────────────────────────────────────
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Install gosec
        run: go install github.com/securego/gosec/v2/cmd/gosec@latest

      - name: Run gosec (fail on medium+ severity)
        run: |
          gosec -conf .gosec.yaml \
            -severity medium \
            -confidence medium \
            -exclude G104,G304,G307 \
            -fmt sarif \
            -out gosec-results.sarif \
            ./...

      - name: Upload gosec results to GitHub Security
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: gosec-results.sarif

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Run govulncheck
        run: govulncheck -tags fts5 ./...

  # ── Gate 4: Trivy CRITICAL scans (Dockerfile + filesystem) ──────────────────
  trivy-release-gate:
    name: Trivy Release Gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Trivy config scan — Dockerfile misconfigs (block on CRITICAL)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          scan-ref: Dockerfile
          format: table
          exit-code: '1'
          severity: CRITICAL

      - name: Trivy filesystem scan — source CVEs (block on CRITICAL)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: table
          exit-code: '1'
          severity: CRITICAL
          ignore-unfixed: true

  # ── Gate 5: unit tests ────────────────────────────────────────────────────────
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Run unit tests
        run: go test -v -short -race -tags fts5 -coverprofile=coverage.out -covermode=atomic ./...

  # ── Gate 6: integration tests ─────────────────────────────────────────────────
  integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: contexthelp
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: contexthelp_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Run integration tests
        run: go test -v -tags=integration,fts5 ./test/integration/...
        env:
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          POSTGRES_USER: contexthelp
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: contexthelp_test
          REDIS_HOST: localhost
          REDIS_PORT: 6379

  # ── Gate 7: build + smoke ────────────────────────────────────────────────────
  build-smoke:
    name: Build + Smoke
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Build dpkms
        run: CGO_ENABLED=1 go build -v -tags fts5 -o bin/dpkms ./cmd/dpkms

      - name: Build ctxt
        run: CGO_ENABLED=1 go build -v -tags fts5 -o bin/ctxt ./cmd/ctxt

      - name: Smoke — binaries respond
        run: |
          ./bin/dpkms version || echo "dpkms built successfully"
          ./bin/ctxt version  || echo "ctxt built successfully"

  # ── GoReleaser: publish only after full gate passes ──────────────────────────
  goreleaser:
    name: GoReleaser
    runs-on: ubuntu-latest
    needs:
      # - secret-scan  (job disabled above; gitleaks runs locally)
      - lint
      - security
      - trivy-release-gate
      - test
      - integration
      - build-smoke

    env:
      # secrets context is unavailable in step-level `if`; surface presence via job env
      HAS_GPG: ${{ secrets.GPG_PRIVATE_KEY != '' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Install mingw-w64 (Windows CGO cross-compilation)
        run: sudo apt-get install -y gcc-mingw-w64-x86-64 g++-mingw-w64-x86-64

      - name: Import GPG key (optional — skip if secret absent)
        id: import_gpg
        if: env.HAS_GPG == 'true'
        uses: crazy-max/ghaction-import-gpg@v7
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
          GPG_FINGERPRINT: ${{ steps.import_gpg.outputs.fingerprint }}
