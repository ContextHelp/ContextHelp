name: CI

on:
  push:
    branches:
      - main
      - next
  pull_request:
    branches:
      - main
      - next
  workflow_dispatch:

jobs:
  # mise.toml is the single source of truth for tool versions. This job parses
  # it once and every other job consumes the outputs, so bumping a version in
  # mise.toml is the only edit needed. scripts/check-toolchain-pins.sh gates the
  # declarations mise cannot reach (Dockerfile base images, go.mod directive).
  toolchain:
    name: Resolve toolchain pins
    runs-on: ubuntu-latest
    outputs:
      go-version: ${{ steps.pins.outputs.go-version }}
      golangci-version: ${{ steps.pins.outputs.golangci-version }}
      node-version: ${{ steps.pins.outputs.node-version }}
      gitleaks-version: ${{ steps.pins.outputs.gitleaks-version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Read pins from mise.toml
        id: pins
        run: |
          go_version=$(sed -n 's/^go = "\(.*\)"$/\1/p' mise.toml)
          golangci_version=$(sed -n 's/^"go:.*golangci-lint" = "\(.*\)"$/\1/p' mise.toml)
          node_version=$(sed -n 's/^node = "\(.*\)"$/\1/p' mise.toml)
          gitleaks_version=$(sed -n 's/^gitleaks = "\(.*\)"$/\1/p' mise.toml)
          if [ -z "$go_version" ] || [ -z "$golangci_version" ] || [ -z "$node_version" ] || [ -z "$gitleaks_version" ]; then
            echo "mise.toml is missing an exact go, golangci-lint, node or gitleaks pin" >&2
            exit 1
          fi
          {
            echo "go-version=$go_version"
            echo "golangci-version=$golangci_version"
            echo "node-version=$node_version"
            echo "gitleaks-version=$gitleaks_version"
          } >>"$GITHUB_OUTPUT"
          echo "go=$go_version golangci-lint=$golangci_version node=$node_version gitleaks=$gitleaks_version"

      - name: Verify every toolchain declaration agrees
        run: scripts/check-toolchain-pins.sh

  # History secret scan: every commit reachable from the checked-out ref,
  # minus the reviewed findings baselined in .gitleaksignore, so only new
  # findings fail. Runs the gitleaks CLI release pinned in mise.toml, not
  # gitleaks-action: the action needs a GITLEAKS_LICENSE secret for
  # organization-owned repos, the MIT-licensed CLI needs nothing.
  secret-scan:
    name: Secret Scanning (gitleaks)
    needs: toolchain
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          # Full history: the scan walks every commit, not just the tip.
          fetch-depth: 0

      # The release tarball, checked against the release's checksum file.
      # `go install` would build a binary whose `gitleaks version` is a
      # placeholder, failing the pin check in `make install-gitleaks`.
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: ${{ needs.toolchain.outputs.gitleaks-version }}
        run: |
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          cd "$RUNNER_TEMP"
          curl -sSfL -o "$tarball" "$base/$tarball"
          curl -sSfL -o checksums.txt "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep " $tarball\$" checksums.txt | sha256sum -c -
          tar -xzf "$tarball" gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Scan history
        run: make security-scan

  lint:
    name: Lint
    needs: toolchain
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          # --new-from-rev below diffs against the merge base, which needs
          # real history. The default depth of 1 leaves no base commit and
          # the gate silently reports nothing.
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ needs.toolchain.outputs.go-version }}
          cache: true

      # go.mod ships local-path replace directives for hop.top/kit and
      # hop.top/c12n (developer convenience). Strip them before any Go
      # step so published tags resolve via the module proxy. No-op when
      # the directives are absent (e.g. on main after rollout).
      - name: Drop local-path replaces
        run: go mod edit -dropreplace=hop.top/kit -dropreplace=hop.top/c12n

      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v${{ needs.toolchain.outputs.golangci-version }}

      # Gate on findings this branch INTRODUCES. The pre-existing backlog
      # is real but large, and blocking every PR on it means the gate gets
      # switched off — which is exactly what scripts/hooks/golangci-staged.sh
      # already says about the local hook.
      - name: Run golangci-lint (new findings)
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          [ -n "$base" ] || base="HEAD~1"
          golangci-lint run --timeout=10m --new-from-rev="$base"

      # The whole-repo scan stays visible so the backlog cannot grow
      # unnoticed, but does not block: it reports the standing count.
      - name: Run golangci-lint (full scan, advisory)
        continue-on-error: true
        run: golangci-lint run --timeout=10m

      - name: Check formatting
        run: |
          if [ -n "$(gofmt -l .)" ]; then
            echo "Go code is not formatted. Run: gofmt -w ."
            gofmt -d .
            exit 1
          fi

      - name: Run go vet
        run: go vet -tags fts5 ./...

  # GoReleaser ships windows/amd64 binaries, cross-compiled with CGO and
  # mingw-w64 (release.yml). Type-check every package, tests included, for
  # that target with the same toolchain so Unix-only syscalls fail here
  # instead of at tag time, then build the two binaries as GoReleaser does
  # (the C amalgamations compile and link only in that step).
  windows:
    name: Windows compile check
    needs: toolchain
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ needs.toolchain.outputs.go-version }}
          cache: true

      # go.mod ships local-path replace directives for hop.top/kit and
      # hop.top/c12n (developer convenience). Strip them before any Go
      # step so published tags resolve via the module proxy. No-op when
      # the directives are absent (e.g. on main after rollout).
      - name: Drop local-path replaces
        run: go mod edit -dropreplace=hop.top/kit -dropreplace=hop.top/c12n

      - name: Install mingw-w64 (Windows CGO cross-compilation)
        run: sudo apt-get install -y gcc-mingw-w64-x86-64

      - name: Vet for windows/amd64
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: '1'
          CC: x86_64-w64-mingw32-gcc
        run: go vet -tags fts5 ./...

      - name: Build ctxt and dpkms for windows/amd64
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: '1'
          CC: x86_64-w64-mingw32-gcc
        run: go build -tags fts5 ./cmd/ctxt ./cmd/dpkms

  security:
    name: Security Scan
    needs: toolchain
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ needs.toolchain.outputs.go-version }}
          cache: true

      # go.mod ships local-path replace directives for hop.top/kit and
      # hop.top/c12n (developer convenience). Strip them before any Go
      # step so published tags resolve via the module proxy. No-op when
      # the directives are absent (e.g. on main after rollout).
      - name: Drop local-path replaces
        run: go mod edit -dropreplace=hop.top/kit -dropreplace=hop.top/c12n

      - name: Install gosec
        run: go install github.com/securego/gosec/v2/cmd/gosec@v2.29.0

      - name: Run gosec (fail on medium+ severity)
        # -tags fts5 is required, not cosmetic: without it 34 packages fail to
        # type-check and gosec logs "skipping SSA analysis, no ssa result" for
        # each, so the taint-tracking rules silently analyze nothing there.
        run: |
          # -tags fts5 is required, not cosmetic. The storage layer is
          # compiled against SQLite's FTS5 module and guards the tag with
          # a build sentinel, so without it 34 packages fail to type-check
          # and gosec logs "skipping SSA analysis" and moves on — it
          # reports success for code it never looked at. govulncheck in
          # this same job already passes the tag.
          #
          # install_launchd.go writes to ~/Library/LaunchAgents and
          # ~/.config/systemd/user. launchd and systemd must traverse
          # those directories and read the unit file, so 0755/0644 is
          # required there rather than an oversight. Scoped to the one
          # file so the rules stay live everywhere else.
          gosec \
            -tags fts5 \
            -severity medium \
            -confidence medium \
            -exclude G104,G304,G307 \
            -exclude-rules "cmd/dpkms/cmd/install_launchd.go:G301,G306" \
            -exclude-dir vendor \
            -exclude-dir docs \
            -exclude-dir test/fixtures \
            -fmt sarif \
            -out gosec-results.sarif \
            ./...

      - name: Upload gosec results to GitHub Security
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        continue-on-error: true
        with:
          sarif_file: gosec-results.sarif

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.8.0

      - name: Run govulncheck
        run: govulncheck -tags fts5 ./...

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        continue-on-error: true
        with:
          sarif_file: 'trivy-results.sarif'

  test:
    name: Test
    needs: toolchain
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ needs.toolchain.outputs.go-version }}
          cache: true

      # go.mod ships local-path replace directives for hop.top/kit and
      # hop.top/c12n (developer convenience). Strip them before any Go
      # step so published tags resolve via the module proxy. No-op when
      # the directives are absent (e.g. on main after rollout).
      - name: Drop local-path replaces
        run: go mod edit -dropreplace=hop.top/kit -dropreplace=hop.top/c12n

      - name: Download dependencies
        shell: bash
        run: go mod download

      - name: Run unit tests
        shell: bash
        env:
          CGO_ENABLED: '1'
        run: go test -v -short -race -tags fts5 -coverprofile=coverage.out -covermode=atomic ./...

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        if: matrix.os == 'ubuntu-latest'
        with:
          files: ./coverage.out
          flags: unittests
          name: codecov-umbrella

      # Black-box suites under test/e2e/ tagged e2e: each builds ctxt,
      # seeds a throwaway store through the binary and asserts exit codes,
      # output and files. Headless-browser smoke tests run when the runner
      # has Chrome and skip otherwise. Other test/e2e suites carry their
      # own tags and are not selected here.
      - name: Run e2e tests
        shell: bash
        env:
          CGO_ENABLED: '1'
        run: go test -v -count=1 -tags 'fts5 e2e' ./test/e2e/...

  # Search-graph viewer (web/searchgraph): its JS unit tests, plus a drift
  # gate on the bundle the Go binary embeds from
  # internal/searchgraph/viewer/dist. No Go toolchain needed. pnpm's version
  # comes from packageManager in web/searchgraph/package.json; node's from
  # the mise.toml pin via the toolchain job (setup-node cannot read
  # mise.toml).
  viewer:
    name: Search-graph viewer
    needs: toolchain
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ needs.toolchain.outputs.node-version }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          package_json_file: web/searchgraph/package.json
          cache: true
          cache_dependency_path: web/searchgraph/pnpm-lock.yaml

      - name: Run viewer JS tests
        run: make test-searchgraph-viewer-js

      - name: Check embedded viewer bundle is current
        run: make check-searchgraph-viewer-dist

  # Web UI (web/ui): drift gate on the bundle the Go binary embeds from
  # internal/ui/dist and serves at /ui. Same setup as the viewer job; pnpm's
  # version comes from packageManager in web/ui/package.json.
  webui:
    name: Web UI bundle
    needs: toolchain
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ needs.toolchain.outputs.node-version }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          package_json_file: web/ui/package.json
          cache: true
          cache_dependency_path: web/ui/pnpm-lock.yaml

      - name: Check embedded web UI bundle is current
        run: make check-ui-dist

  integration:
    name: Integration Tests
    needs: toolchain
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/next'
    services:
      postgres:
        # pgvector-bundled image: the Postgres driver's first migration is
        # CREATE EXTENSION vector, which plain postgres images cannot load.
        image: pgvector/pgvector:0.8.6-pg16-bookworm
        env:
          POSTGRES_USER: contexthelp
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: contexthelp_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7.4.11-alpine3.21
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ needs.toolchain.outputs.go-version }}
          cache: true

      # go.mod ships local-path replace directives for hop.top/kit and
      # hop.top/c12n (developer convenience). Strip them before any Go
      # step so published tags resolve via the module proxy. No-op when
      # the directives are absent (e.g. on main after rollout).
      - name: Drop local-path replaces
        run: go mod edit -dropreplace=hop.top/kit -dropreplace=hop.top/c12n

      # Postgres driver, storage factory and embeddings registry suites
      # live next to the code, not under test/integration/. They carry the
      # same integration build tag and read the same POSTGRES_* env block,
      # so they must be listed here explicitly or CI never runs them.
      - name: Run integration tests
        run: >-
          go test -v -tags=integration,fts5
          ./test/integration/...
          ./internal/storage/postgres/...
          ./internal/storageutil/...
          ./internal/embeddings/registry/...
        env:
          CGO_ENABLED: '1'
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          POSTGRES_USER: contexthelp
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: contexthelp_test
          REDIS_HOST: localhost
          REDIS_PORT: 6379

      # Task-job claim and re-projection scenarios on Postgres. They live
      # next to the worker pool; only the Postgres variants run here (the
      # SQLite ones run in the unit job).
      - name: Run task-job claim and re-projection tests on Postgres
        run: >-
          go test -v -tags=integration,fts5 -count=1
          -run 'Test(Claim|Reproject)_.*_Postgres' ./internal/jobs/
        env:
          CGO_ENABLED: '1'
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          POSTGRES_USER: contexthelp
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: contexthelp_test

      # HTTP handlers against a Postgres store (object reads and writes,
      # inbox, pages/index/stats, the entity gate). They need the
      # integration tag; the package's other tests run in the unit job.
      - name: Run HTTP handler tests on Postgres
        run: >-
          go test -v -tags=integration,fts5 -count=1
          -run '_Postgres$' ./internal/server/http/
        env:
          CGO_ENABLED: '1'
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          POSTGRES_USER: contexthelp
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: contexthelp_test

      # The embeddings journey drives the built ctxt and dpkms binaries; its
      # Postgres variant lives next to the CLI it drives, so only that test
      # runs here (the SQLite variant runs in the unit job).
      - name: Run embeddings journey on Postgres
        run: >-
          go test -v -tags=integration,fts5 -count=1
          -run TestEmbeddingsJourney_Postgres ./cmd/ctxt/cmd/
        env:
          CGO_ENABLED: '1'
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          POSTGRES_USER: contexthelp
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: contexthelp_test

      # The search-graph endpoint's black-box suite drives the built ctxt
      # and dpkms binaries over throwaway databases; its Postgres run needs
      # both the e2e and integration tags, so only that test runs here (the
      # SQLite run is part of the test job's e2e step).
      - name: Run search-graph endpoint e2e on Postgres
        run: >-
          go test -v -count=1 -tags 'fts5 e2e integration'
          -run TestDpkmsGraph_Postgres ./test/e2e/searchgraph/
        env:
          CGO_ENABLED: '1'
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          POSTGRES_USER: contexthelp
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: contexthelp_test

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [toolchain, lint, security, secret-scan, test]
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ needs.toolchain.outputs.go-version }}
          cache: true

      # go.mod ships local-path replace directives for hop.top/kit and
      # hop.top/c12n (developer convenience). Strip them before any Go
      # step so published tags resolve via the module proxy. No-op when
      # the directives are absent (e.g. on main after rollout).
      - name: Drop local-path replaces
        run: go mod edit -dropreplace=hop.top/kit -dropreplace=hop.top/c12n

      - name: Build dpkms
        run: CGO_ENABLED=1 go build -v -tags fts5 -o bin/dpkms ./cmd/dpkms

      - name: Build ctxt
        run: CGO_ENABLED=1 go build -v -tags fts5 -o bin/ctxt ./cmd/ctxt

      - name: Verify binaries
        run: |
          ./bin/dpkms version || echo "dpkms built successfully"
          ./bin/ctxt version || echo "ctxt built successfully"

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: binaries
          path: bin/
          retention-days: 7
