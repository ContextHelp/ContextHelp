name: CI

on:
  push:
    branches:
      - main
      - next
  pull_request:
    branches:
      - main
      - next
  workflow_dispatch:
  # release.yml runs this whole workflow as the gate in front of a
  # release, so a tag ships only after every job here passes on it. In a
  # called run the github context is the caller's (event push, ref
  # refs/tags/v*), so a job-level `if:` written for the triggers above can
  # skip a gate on release; scripts/check-toolchain-pins.sh refuses one.
  workflow_call:
    outputs:
      go-version:
        description: Go version pinned in mise.toml
        value: ${{ jobs.toolchain.outputs.go-version }}
      goreleaser-version:
        description: GoReleaser version pinned in mise.toml
        value: ${{ jobs.toolchain.outputs.goreleaser-version }}

# Every check step below is `make <target>`: the Makefile holds the
# commands, flags, tags and env, and `make ci-<job>` runs the same targets
# in the same order on a laptop (`make ci` runs every job).
# scripts/check-ci-parity.sh (the toolchain job runs it) fails when a step
# runs anything inline or ci-<job> stops matching. Steps that only install
# a tool are exempt; scripts/ci/tools.sh gives a local run the same pins.

jobs:
  # mise.toml is the single source of truth for tool versions. This job parses
  # it once and every other job consumes the outputs, so bumping a version in
  # mise.toml is the only edit needed. scripts/check-toolchain-pins.sh gates the
  # declarations mise cannot reach (Dockerfile base images, go.mod directive).
  toolchain:
    name: Resolve toolchain pins
    runs-on: ubuntu-latest
    outputs:
      go-version: ${{ steps.pins.outputs.go-version }}
      golangci-version: ${{ steps.pins.outputs.golangci-version }}
      node-version: ${{ steps.pins.outputs.node-version }}
      gitleaks-version: ${{ steps.pins.outputs.gitleaks-version }}
      goreleaser-version: ${{ steps.pins.outputs.goreleaser-version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Read pins from mise.toml
        id: pins
        run: |
          go_version=$(sed -n 's/^go = "\(.*\)"$/\1/p' mise.toml)
          golangci_version=$(sed -n 's/^"go:.*golangci-lint" = "\(.*\)"$/\1/p' mise.toml)
          node_version=$(sed -n 's/^node = "\(.*\)"$/\1/p' mise.toml)
          gitleaks_version=$(sed -n 's/^gitleaks = "\(.*\)"$/\1/p' mise.toml)
          goreleaser_version=$(sed -n 's/^goreleaser = "\(.*\)"$/\1/p' mise.toml)
          if [ -z "$go_version" ] || [ -z "$golangci_version" ] || [ -z "$node_version" ] || [ -z "$gitleaks_version" ] || [ -z "$goreleaser_version" ]; then
            echo "mise.toml is missing an exact go, golangci-lint, node, gitleaks or goreleaser pin" >&2
            exit 1
          fi
          {
            echo "go-version=$go_version"
            echo "golangci-version=$golangci_version"
            echo "node-version=$node_version"
            echo "gitleaks-version=$gitleaks_version"
            echo "goreleaser-version=$goreleaser_version"
          } >>"$GITHUB_OUTPUT"
          echo "go=$go_version golangci-lint=$golangci_version node=$node_version gitleaks=$gitleaks_version goreleaser=$goreleaser_version"

      - name: Verify every toolchain declaration agrees
        run: make toolchain-check

      - name: Verify make ci-<job> runs what each job runs
        run: make ci-parity-check

      # The release binary at the mise.toml pin; release.yml runs the same.
      - name: Install goreleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          install-only: true
          version: v${{ steps.pins.outputs.goreleaser-version }}

      # A field this GoReleaser does not know fails here, not at tag time.
      - name: Check GoReleaser config
        run: make goreleaser-check

  # History secret scan: every commit reachable from the checked-out ref,
  # minus the reviewed findings baselined in .gitleaksignore, so only new
  # findings fail. Runs the gitleaks CLI release pinned in mise.toml, not
  # gitleaks-action: the action needs a GITLEAKS_LICENSE secret for
  # organization-owned repos, the MIT-licensed CLI needs nothing.
  secret-scan:
    name: Secret Scanning (gitleaks)
    needs: toolchain
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          # Full history: the scan walks every commit, not just the tip.
          fetch-depth: 0

      # The release tarball, checked against the release's checksum file.
      # `go install` would build a binary whose `gitleaks version` is a
      # placeholder, failing the pin check in `make install-gitleaks`.
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: ${{ needs.toolchain.outputs.gitleaks-version }}
        run: |
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          cd "$RUNNER_TEMP"
          curl -sSfL -o "$tarball" "$base/$tarball"
          curl -sSfL -o checksums.txt "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep " $tarball\$" checksums.txt | sha256sum -c -
          tar -xzf "$tarball" gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Scan history
        run: make security-scan

  lint:
    name: Lint
    needs: toolchain
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          # --new-from-rev below diffs against the merge base, which needs
          # real history. The default depth of 1 leaves no base commit and
          # the gate silently reports nothing.
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ needs.toolchain.outputs.go-version }}
          cache: true

      # Strips local-path replaces of the CI_DROP_REPLACES modules, so
      # published tags resolve via the module proxy; no-op without them.
      - name: Drop local-path replaces
        run: make ci-drop-replaces

      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v${{ needs.toolchain.outputs.golangci-version }}

      # The whole repo is at zero findings at the pinned version, so the
      # full scan blocks. There is no new-findings step: a full scan is a
      # superset of one. The local hook (scripts/hooks/golangci-staged.sh)
      # keeps --new-from-rev for speed, and `make lint-new` does the same.
      - name: Run golangci-lint (full scan)
        run: make ci-lint-full

      - name: Check formatting
        run: make ci-gofmt

      - name: Run go vet
        run: make ci-vet

  # GoReleaser ships windows/amd64 binaries, cross-compiled with CGO and
  # mingw-w64 (release.yml). Type-check every package, tests included, for
  # that target with the same toolchain so Unix-only syscalls fail here
  # instead of at tag time, then build the two binaries as GoReleaser does
  # (the C amalgamations compile and link only in that step).
  windows:
    name: Windows compile check
    needs: toolchain
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ needs.toolchain.outputs.go-version }}
          cache: true

      # Strips local-path replaces of the CI_DROP_REPLACES modules, so
      # published tags resolve via the module proxy; no-op without them.
      - name: Drop local-path replaces
        run: make ci-drop-replaces

      - name: Install mingw-w64 (Windows CGO cross-compilation)
        run: sudo apt-get install -y gcc-mingw-w64-x86-64

      - name: Vet for windows/amd64
        run: make ci-windows-vet

      - name: Build ctxt and dpkms for windows/amd64
        run: make ci-windows-build

  security:
    name: Security Scan
    needs: toolchain
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ needs.toolchain.outputs.go-version }}
          cache: true

      # Strips local-path replaces of the CI_DROP_REPLACES modules, so
      # published tags resolve via the module proxy; no-op without them.
      - name: Drop local-path replaces
        run: make ci-drop-replaces

      # gosec and govulncheck run via `go run <pkg>@<version>` at the
      # Makefile's GOSEC_VERSION / GOVULNCHECK_VERSION. gosec needs -tags
      # fts5 or it analyzes nothing in 34 packages; see the gosec target.
      - name: Run gosec (fail on medium+ severity)
        run: make gosec

      - name: Upload gosec results to GitHub Security
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        continue-on-error: true
        with:
          sarif_file: gosec-results.sarif

      - name: Run govulncheck
        run: make govulncheck

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        continue-on-error: true
        with:
          sarif_file: 'trivy-results.sarif'

  test:
    name: Test
    needs: toolchain
    runs-on: ${{ matrix.os }}
    strategy:
      # Stop the other OS once one fails; go test -failfast (Makefile) stops each package at its first failure.
      fail-fast: true
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ needs.toolchain.outputs.go-version }}
          cache: true

      # Strips local-path replaces of the CI_DROP_REPLACES modules, so
      # published tags resolve via the module proxy; no-op without them.
      - name: Drop local-path replaces
        run: make ci-drop-replaces

      - name: Download dependencies
        shell: bash
        run: go mod download

      - name: Run unit tests
        shell: bash
        run: make ci-test-unit

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        if: matrix.os == 'ubuntu-latest'
        with:
          files: ./coverage.out
          flags: unittests
          name: codecov-umbrella

      # Black-box suites under test/e2e/ tagged e2e; headless-browser
      # checks run when the runner has Chrome and skip otherwise.
      - name: Run e2e tests
        shell: bash
        run: make ci-test-e2e

  # Search-graph viewer (web/searchgraph): its JS unit tests, plus a drift
  # gate on the bundle the Go binary embeds from
  # internal/searchgraph/viewer/dist. No Go toolchain needed. pnpm's version
  # comes from packageManager in web/searchgraph/package.json; node's from
  # the mise.toml pin via the toolchain job (setup-node cannot read
  # mise.toml).
  viewer:
    name: Search-graph viewer
    needs: toolchain
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ needs.toolchain.outputs.node-version }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          package_json_file: web/searchgraph/package.json
          cache: true
          cache_dependency_path: web/searchgraph/pnpm-lock.yaml

      - name: Run viewer JS tests
        run: make test-searchgraph-viewer-js

      - name: Check embedded viewer bundle is current
        run: make check-searchgraph-viewer-dist

  # Web UI (web/ui): drift gate on the bundle the Go binary embeds from
  # internal/ui/dist and serves at /ui. Same setup as the viewer job; pnpm's
  # version comes from packageManager in web/ui/package.json.
  webui:
    name: Web UI bundle
    needs: toolchain
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ needs.toolchain.outputs.node-version }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          package_json_file: web/ui/package.json
          cache: true
          cache_dependency_path: web/ui/pnpm-lock.yaml

      - name: Check embedded web UI bundle is current
        run: make check-ui-dist

  integration:
    name: Integration Tests
    needs: toolchain
    runs-on: ubuntu-latest
    services:
      postgres:
        # pgvector-bundled image: the Postgres driver's first migration is
        # CREATE EXTENSION vector, which plain postgres images cannot load.
        image: pgvector/pgvector:0.8.6-pg16-bookworm
        env:
          POSTGRES_USER: contexthelp
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: contexthelp_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ needs.toolchain.outputs.go-version }}
          cache: true

      # Strips local-path replaces of the CI_DROP_REPLACES modules, so
      # published tags resolve via the module proxy; no-op without them.
      - name: Drop local-path replaces
        run: make ci-drop-replaces

      # The POSTGRES_* env the tests read defaults to the service env
      # above (Makefile, CI_INTEGRATION_STEPS).
      - name: Run integration tests
        run: make ci-integration-suites

      - name: Run task-job claim and re-projection tests on Postgres
        run: make ci-integration-jobs

      - name: Run HTTP handler tests on Postgres
        run: make ci-integration-http

      - name: Run embeddings journey on Postgres
        run: make ci-integration-journey

      - name: Run search-graph endpoint e2e on Postgres
        run: make ci-integration-searchgraph

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [toolchain, lint, security, secret-scan, test]
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ needs.toolchain.outputs.go-version }}
          cache: true

      # Strips local-path replaces of the CI_DROP_REPLACES modules, so
      # published tags resolve via the module proxy; no-op without them.
      - name: Drop local-path replaces
        run: make ci-drop-replaces

      - name: Build dpkms
        run: make ci-build-dpkms

      - name: Build ctxt
        run: make ci-build-ctxt

      - name: Verify binaries
        run: make ci-build-verify

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: binaries
          path: bin/
          retention-days: 7
