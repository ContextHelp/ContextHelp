name: CI

on:
  push:
    branches:
      - main
      - next
  pull_request:
    branches:
      - main
      - next
  workflow_dispatch:

jobs:
  # mise.toml is the single source of truth for tool versions. This job parses
  # it once and every other job consumes the outputs, so bumping a version in
  # mise.toml is the only edit needed. scripts/check-toolchain-pins.sh gates the
  # declarations mise cannot reach (Dockerfile base images, go.mod directive).
  toolchain:
    name: Resolve toolchain pins
    runs-on: ubuntu-latest
    outputs:
      go-version: ${{ steps.pins.outputs.go-version }}
      golangci-version: ${{ steps.pins.outputs.golangci-version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Read pins from mise.toml
        id: pins
        run: |
          go_version=$(sed -n 's/^go = "\(.*\)"$/\1/p' mise.toml)
          golangci_version=$(sed -n 's/^"go:.*golangci-lint" = "\(.*\)"$/\1/p' mise.toml)
          if [ -z "$go_version" ] || [ -z "$golangci_version" ]; then
            echo "mise.toml is missing an exact go or golangci-lint pin" >&2
            exit 1
          fi
          echo "go-version=$go_version" >>"$GITHUB_OUTPUT"
          echo "golangci-version=$golangci_version" >>"$GITHUB_OUTPUT"
          echo "go=$go_version golangci-lint=$golangci_version"

      - name: Verify every toolchain declaration agrees
        run: scripts/check-toolchain-pins.sh

  # ── DISABLED: secret scanning runs locally ───────────────────────────────
  # gitleaks-action requires a license for organization-owned repos and this
  # repo is org-owned, so the job fails with "missing gitleaks license"
  # before scanning anything. Until a GITLEAKS_LICENSE secret exists, secret
  # scanning runs locally instead: `make install-hooks` wires a pre-commit
  # hook, `make secret-scan-local` scans the working tree.
  #
  # To re-enable: obtain a free key at gitleaks.io, add it as the
  # GITLEAKS_LICENSE secret, uncomment this job, and restore secret-scan to
  # the build job's needs list.
  # secret-scan:
  #   name: Secret Scanning (gitleaks)
  #   runs-on: ubuntu-latest
  #   permissions:
  #     contents: read
  #     pull-requests: read
  #   steps:
  #     - name: Checkout code
  #       uses: actions/checkout@v7
  #       with:
  #         fetch-depth: 0
  #
  #     - name: Run gitleaks
  #       uses: gitleaks/gitleaks-action@v3
  #       env:
  #         GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  #         # Organization-owned repos need a (free) gitleaks license; personal
  #         # accounts do not. This repo moved to the ContextHelp org, so the
  #         # scan started failing with "missing gitleaks license". Obtain one
  #         # at gitleaks.io and store it as the GITLEAKS_LICENSE secret.
  #         GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
  #
  lint:
    name: Lint
    needs: toolchain
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          # --new-from-rev below diffs against the merge base, which needs
          # real history. The default depth of 1 leaves no base commit and
          # the gate silently reports nothing.
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ needs.toolchain.outputs.go-version }}
          cache: true

      # go.mod ships local-path replace directives for hop.top/kit and
      # hop.top/c12n (developer convenience). Strip them before any Go
      # step so published tags resolve via the module proxy. No-op when
      # the directives are absent (e.g. on main after rollout).
      - name: Drop local-path replaces
        run: go mod edit -dropreplace=hop.top/kit -dropreplace=hop.top/c12n

      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v${{ needs.toolchain.outputs.golangci-version }}

      # Gate on findings this branch INTRODUCES. The pre-existing backlog
      # is real but large, and blocking every PR on it means the gate gets
      # switched off — which is exactly what scripts/hooks/golangci-staged.sh
      # already says about the local hook.
      - name: Run golangci-lint (new findings)
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          [ -n "$base" ] || base="HEAD~1"
          golangci-lint run --timeout=10m --new-from-rev="$base"

      # The whole-repo scan stays visible so the backlog cannot grow
      # unnoticed, but does not block: it reports the standing count.
      - name: Run golangci-lint (full scan, advisory)
        continue-on-error: true
        run: golangci-lint run --timeout=10m

      - name: Check formatting
        run: |
          if [ -n "$(gofmt -l .)" ]; then
            echo "Go code is not formatted. Run: gofmt -w ."
            gofmt -d .
            exit 1
          fi

      - name: Run go vet
        run: go vet -tags fts5 ./...

  security:
    name: Security Scan
    needs: toolchain
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ needs.toolchain.outputs.go-version }}
          cache: true

      # go.mod ships local-path replace directives for hop.top/kit and
      # hop.top/c12n (developer convenience). Strip them before any Go
      # step so published tags resolve via the module proxy. No-op when
      # the directives are absent (e.g. on main after rollout).
      - name: Drop local-path replaces
        run: go mod edit -dropreplace=hop.top/kit -dropreplace=hop.top/c12n

      - name: Install gosec
        run: go install github.com/securego/gosec/v2/cmd/gosec@v2.29.0

      - name: Run gosec (fail on medium+ severity)
        # -tags fts5 is required, not cosmetic: without it 34 packages fail to
        # type-check and gosec logs "skipping SSA analysis, no ssa result" for
        # each, so the taint-tracking rules silently analyze nothing there.
        run: |
          # -tags fts5 is required, not cosmetic. The storage layer is
          # compiled against SQLite's FTS5 module and guards the tag with
          # a build sentinel, so without it 34 packages fail to type-check
          # and gosec logs "skipping SSA analysis" and moves on — it
          # reports success for code it never looked at. govulncheck in
          # this same job already passes the tag.
          #
          # install_launchd.go writes to ~/Library/LaunchAgents and
          # ~/.config/systemd/user. launchd and systemd must traverse
          # those directories and read the unit file, so 0755/0644 is
          # required there rather than an oversight. Scoped to the one
          # file so the rules stay live everywhere else.
          gosec \
            -tags fts5 \
            -severity medium \
            -confidence medium \
            -exclude G104,G304,G307 \
            -exclude-rules "cmd/dpkms/cmd/install_launchd.go:G301,G306" \
            -exclude-dir vendor \
            -exclude-dir docs \
            -exclude-dir test/fixtures \
            -fmt sarif \
            -out gosec-results.sarif \
            ./...

      - name: Upload gosec results to GitHub Security
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        continue-on-error: true
        with:
          sarif_file: gosec-results.sarif

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Run govulncheck
        run: govulncheck -tags fts5 ./...

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        continue-on-error: true
        with:
          sarif_file: 'trivy-results.sarif'

  test:
    name: Test
    needs: toolchain
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ needs.toolchain.outputs.go-version }}
          cache: true

      # go.mod ships local-path replace directives for hop.top/kit and
      # hop.top/c12n (developer convenience). Strip them before any Go
      # step so published tags resolve via the module proxy. No-op when
      # the directives are absent (e.g. on main after rollout).
      - name: Drop local-path replaces
        run: go mod edit -dropreplace=hop.top/kit -dropreplace=hop.top/c12n

      - name: Download dependencies
        shell: bash
        run: go mod download

      - name: Run unit tests
        shell: bash
        env:
          CGO_ENABLED: '1'
        run: go test -v -short -race -tags fts5 -coverprofile=coverage.out -covermode=atomic ./...

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        if: matrix.os == 'ubuntu-latest'
        with:
          files: ./coverage.out
          flags: unittests
          name: codecov-umbrella

  integration:
    name: Integration Tests
    needs: toolchain
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/next'
    services:
      postgres:
        # pgvector-bundled image: the Postgres driver's first migration is
        # CREATE EXTENSION vector, which plain postgres images cannot load.
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: contexthelp
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: contexthelp_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ needs.toolchain.outputs.go-version }}
          cache: true

      # go.mod ships local-path replace directives for hop.top/kit and
      # hop.top/c12n (developer convenience). Strip them before any Go
      # step so published tags resolve via the module proxy. No-op when
      # the directives are absent (e.g. on main after rollout).
      - name: Drop local-path replaces
        run: go mod edit -dropreplace=hop.top/kit -dropreplace=hop.top/c12n

      # Postgres driver + embeddings registry conformance suites live next
      # to the code, not under test/integration/. They carry the same
      # integration build tag and read the same POSTGRES_* env block, so
      # they must be listed here explicitly or CI never runs them.
      - name: Run integration tests
        run: >-
          go test -v -tags=integration,fts5
          ./test/integration/...
          ./internal/storage/postgres/...
          ./internal/embeddings/registry/...
        env:
          CGO_ENABLED: '1'
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          POSTGRES_USER: contexthelp
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: contexthelp_test
          REDIS_HOST: localhost
          REDIS_PORT: 6379

      # Task-job claim scenarios: two drivers (two dpkms) on one Postgres
      # database. They live next to the worker pool; only the Postgres
      # variants run here (the SQLite ones run in the unit job).
      - name: Run task-job claim tests on Postgres
        run: >-
          go test -v -tags=integration,fts5 -count=1
          -run 'TestClaim_.*_Postgres' ./internal/jobs/
        env:
          CGO_ENABLED: '1'
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          POSTGRES_USER: contexthelp
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: contexthelp_test

      # The embeddings journey drives the built ctxt and dpkms binaries; its
      # Postgres variant lives next to the CLI it drives, so only that test
      # runs here (the SQLite variant runs in the unit job).
      - name: Run embeddings journey on Postgres
        run: >-
          go test -v -tags=integration,fts5 -count=1
          -run TestEmbeddingsJourney_Postgres ./cmd/ctxt/cmd/
        env:
          CGO_ENABLED: '1'
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          POSTGRES_USER: contexthelp
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: contexthelp_test

  build:
    name: Build
    runs-on: ubuntu-latest
    # secret-scan removed from needs while the gitleaks job is disabled above
    needs: [toolchain, lint, security, test]
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ needs.toolchain.outputs.go-version }}
          cache: true

      # go.mod ships local-path replace directives for hop.top/kit and
      # hop.top/c12n (developer convenience). Strip them before any Go
      # step so published tags resolve via the module proxy. No-op when
      # the directives are absent (e.g. on main after rollout).
      - name: Drop local-path replaces
        run: go mod edit -dropreplace=hop.top/kit -dropreplace=hop.top/c12n

      - name: Build dpkms
        run: CGO_ENABLED=1 go build -v -tags fts5 -o bin/dpkms ./cmd/dpkms

      - name: Build ctxt
        run: CGO_ENABLED=1 go build -v -tags fts5 -o bin/ctxt ./cmd/ctxt

      - name: Verify binaries
        run: |
          ./bin/dpkms version || echo "dpkms built successfully"
          ./bin/ctxt version || echo "ctxt built successfully"

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: binaries
          path: bin/
          retention-days: 7
