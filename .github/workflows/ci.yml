name: CI

on:
  push:
    branches:
      - main
      - next
  pull_request:
    branches:
      - main
      - next
  workflow_dispatch:

env:
  GO_VERSION: '1.26'

jobs:
  # ── DISABLED: secret scanning runs locally ───────────────────────────────
  # gitleaks-action requires a license for organization-owned repos and this
  # repo is org-owned, so the job fails with "missing gitleaks license"
  # before scanning anything. Until a GITLEAKS_LICENSE secret exists, secret
  # scanning runs locally instead: `make install-hooks` wires a pre-commit
  # hook, `make secret-scan-local` scans the working tree.
  #
  # To re-enable: obtain a free key at gitleaks.io, add it as the
  # GITLEAKS_LICENSE secret, uncomment this job, and restore secret-scan to
  # the build job's needs list.
  # secret-scan:
  #   name: Secret Scanning (gitleaks)
  #   runs-on: ubuntu-latest
  #   permissions:
  #     contents: read
  #     pull-requests: read
  #   steps:
  #     - name: Checkout code
  #       uses: actions/checkout@v7
  #       with:
  #         fetch-depth: 0
  #
  #     - name: Run gitleaks
  #       uses: gitleaks/gitleaks-action@v3
  #       env:
  #         GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  #         # Organization-owned repos need a (free) gitleaks license; personal
  #         # accounts do not. This repo moved to the ContextHelp org, so the
  #         # scan started failing with "missing gitleaks license". Obtain one
  #         # at gitleaks.io and store it as the GITLEAKS_LICENSE secret.
  #         GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
  #
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      # go.mod ships local-path replace directives for hop.top/kit and
      # hop.top/c12n (developer convenience). Strip them before any Go
      # step so published tags resolve via the module proxy. No-op when
      # the directives are absent (e.g. on main after rollout).
      - name: Drop local-path replaces
        run: go mod edit -dropreplace=hop.top/kit -dropreplace=hop.top/c12n

      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.1.6

      - name: Run golangci-lint
        run: golangci-lint run --timeout=5m --verbose

      - name: Check formatting
        run: |
          if [ -n "$(gofmt -l .)" ]; then
            echo "Go code is not formatted. Run: gofmt -w ."
            gofmt -d .
            exit 1
          fi

      - name: Run go vet
        run: go vet -tags fts5 ./...

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      # go.mod ships local-path replace directives for hop.top/kit and
      # hop.top/c12n (developer convenience). Strip them before any Go
      # step so published tags resolve via the module proxy. No-op when
      # the directives are absent (e.g. on main after rollout).
      - name: Drop local-path replaces
        run: go mod edit -dropreplace=hop.top/kit -dropreplace=hop.top/c12n

      - name: Install gosec
        run: go install github.com/securego/gosec/v2/cmd/gosec@latest

      - name: Run gosec (fail on medium+ severity)
        run: |
          gosec \
            -severity medium \
            -confidence medium \
            -exclude G104,G304,G307 \
            -exclude-dir vendor \
            -exclude-dir docs \
            -exclude-dir test/fixtures \
            -fmt sarif \
            -out gosec-results.sarif \
            ./...

      - name: Upload gosec results to GitHub Security
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        continue-on-error: true
        with:
          sarif_file: gosec-results.sarif

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Run govulncheck
        run: govulncheck -tags fts5 ./...

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        continue-on-error: true
        with:
          sarif_file: 'trivy-results.sarif'

  test:
    name: Test
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        go-version: ['1.26']
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go-version }}
          cache: true

      # go.mod ships local-path replace directives for hop.top/kit and
      # hop.top/c12n (developer convenience). Strip them before any Go
      # step so published tags resolve via the module proxy. No-op when
      # the directives are absent (e.g. on main after rollout).
      - name: Drop local-path replaces
        run: go mod edit -dropreplace=hop.top/kit -dropreplace=hop.top/c12n

      - name: Download dependencies
        shell: bash
        run: go mod download

      - name: Run unit tests
        shell: bash
        env:
          CGO_ENABLED: '1'
        run: go test -v -short -race -tags fts5 -coverprofile=coverage.out -covermode=atomic ./...

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        if: matrix.os == 'ubuntu-latest'
        with:
          files: ./coverage.out
          flags: unittests
          name: codecov-umbrella

  integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    services:
      postgres:
        # pgvector-bundled image: the Postgres driver's first migration is
        # CREATE EXTENSION vector, which plain postgres images cannot load.
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: contexthelp
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: contexthelp_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      # go.mod ships local-path replace directives for hop.top/kit and
      # hop.top/c12n (developer convenience). Strip them before any Go
      # step so published tags resolve via the module proxy. No-op when
      # the directives are absent (e.g. on main after rollout).
      - name: Drop local-path replaces
        run: go mod edit -dropreplace=hop.top/kit -dropreplace=hop.top/c12n

      # Postgres driver + embeddings registry conformance suites live next
      # to the code, not under test/integration/. They carry the same
      # integration build tag and read the same POSTGRES_* env block, so
      # they must be listed here explicitly or CI never runs them.
      - name: Run integration tests
        run: >-
          go test -v -tags=integration,fts5
          ./test/integration/...
          ./internal/storage/postgres/...
          ./internal/embeddings/registry/...
        env:
          CGO_ENABLED: '1'
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          POSTGRES_USER: contexthelp
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: contexthelp_test
          REDIS_HOST: localhost
          REDIS_PORT: 6379

  build:
    name: Build
    runs-on: ubuntu-latest
    # secret-scan removed from needs while the gitleaks job is disabled above
    needs: [lint, security, test]
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      # go.mod ships local-path replace directives for hop.top/kit and
      # hop.top/c12n (developer convenience). Strip them before any Go
      # step so published tags resolve via the module proxy. No-op when
      # the directives are absent (e.g. on main after rollout).
      - name: Drop local-path replaces
        run: go mod edit -dropreplace=hop.top/kit -dropreplace=hop.top/c12n

      - name: Build dpkms
        run: CGO_ENABLED=1 go build -v -tags fts5 -o bin/dpkms ./cmd/dpkms

      - name: Build ctxt
        run: CGO_ENABLED=1 go build -v -tags fts5 -o bin/ctxt ./cmd/ctxt

      - name: Verify binaries
        run: |
          ./bin/dpkms version || echo "dpkms built successfully"
          ./bin/ctxt version || echo "ctxt built successfully"

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: binaries
          path: bin/
          retention-days: 7
