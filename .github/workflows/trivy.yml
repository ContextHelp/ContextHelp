name: Trivy Security Scan

on:
  pull_request:
    paths:
      - 'Dockerfile'
      - 'docker/**'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/trivy.yml'
  schedule:
    # nightly at 02:00 UTC — builds and scans the runtime image for new CVEs
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  # ── PR: scan Dockerfile for misconfigurations ──────────────────────────────
  dockerfile-scan:
    name: Dockerfile Misconfiguration Scan
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
      security-events: write
      actions: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Run Trivy config scan (Dockerfile)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: Dockerfile
          format: sarif
          output: trivy-dockerfile.sarif
          exit-code: '0'
          severity: CRITICAL

      - name: Upload SARIF to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        continue-on-error: true
        with:
          sarif_file: trivy-dockerfile.sarif
          category: dockerfile-misconfig

  # ── PR: filesystem scan (packages / secrets in source tree) ───────────────
  fs-scan:
    name: Filesystem Vulnerability Scan
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
      security-events: write
      actions: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy-fs.sarif
          exit-code: '0'
          severity: CRITICAL
          ignore-unfixed: true

      - name: Upload SARIF to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        continue-on-error: true
        with:
          sarif_file: trivy-fs.sarif
          category: filesystem-vuln

  # ── Nightly: scan the image docker.yml publishes, built in-job ───────────
  # Nothing is published to scan: release.yml (GoReleaser) ships binaries
  # only, and docker.yml's push to main has never completed, so no
  # ghcr.io/<owner>/ctxt-dpkms tag exists. The job builds the same
  # Dockerfile target docker.yml pushes (runtime, linux/amd64) from the
  # default branch and scans that, so new base-image and dependency CVEs
  # surface whether or not a publish ever ran.
  nightly-image-scan:
    name: Nightly Image Scan
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
      security-events: write
      actions: read

    env:
      SCAN_IMAGE: ctxt-dpkms:nightly-scan

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build runtime image (not pushed)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          target: runtime
          platforms: linux/amd64
          load: true
          push: false
          tags: ${{ env.SCAN_IMAGE }}
          build-args: |
            VERSION=nightly
            GIT_COMMIT=${{ github.sha }}
          cache-from: type=gha
          # docker.yml writes this cache; the nightly only reads it.

      - name: Run Trivy image scan — upload results
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: ${{ env.SCAN_IMAGE }}
          format: sarif
          output: trivy-image.sarif
          exit-code: '0'
          severity: CRITICAL,HIGH
          ignore-unfixed: true

      - name: Upload SARIF to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        continue-on-error: true
        with:
          sarif_file: trivy-image.sarif
          category: image-vuln-nightly

      - name: Fail on CRITICAL CVEs in the image
        # re-run with exit-code 1 after uploading so nightly turns red on CRITICALs
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: ${{ env.SCAN_IMAGE }}
          format: table
          exit-code: '1'
          severity: CRITICAL
          ignore-unfixed: true
