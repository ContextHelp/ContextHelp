# Plugins: not loaded from config
#
# Neither ctxt nor dpkms loads plugins today. The config schema declares a
# plugins list (entries with type, plugin and config keys), but no code
# reads it, so any value there is ignored. Aliases are not configured here
# either: they would live in the database behind /api/v1/aliases, which
# answers without storing anything while no aliasing plugin is loaded.
# This file sets nothing.
#
# Plugin API and status: docs/plugin-authoring-guide.md, docs/plugins/.
