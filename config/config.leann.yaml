################################################################################
# Troubleshooting LEANN
################################################################################

# Enable debug logging for LEANN
logging:
  level: debug

  # LEANN-specific logging
  components:
    leann:
      level: debug
      # Log index operations
      log_operations: true
      # Log query performance
      log_queries: true
      # Log recomputation events
      log_recompute: true

# Development settings for LEANN testing
development:
  # Verify LEANN results match traditional backends
  verify_leann_results: true

  # Compare query performance
  benchmark_queries: true

  # Log storage statistics
  log_storage_stats: true
