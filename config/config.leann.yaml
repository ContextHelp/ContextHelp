# ContextHelp LEANN Storage Integration Configuration
# This file demonstrates LEANN integration for efficient vector storage
# See docs/integrations/leann-integration.md for details
#
# LEANN provides:
# - 97% storage efficiency through on-demand embedding recomputation
# - Graph-based RAG with selective retrieval
# - Multimodal support (text + vision)
# - Local-first, privacy-preserving architecture

version: 1

################################################################################
# Strategy 1: LEANN as Primary Storage Backend
# Use LEANN for all vector storage with on-demand recomputation
################################################################################

storage:
  # Use LEANN as storage backend
  type: leann

  # Path to LEANN index directory
  path: ~/.local/share/contexthelp/leann

  # Safe concurrency mode
  concurrency: safe

  # LEANN-specific options
  options:
    # Enable on-demand embedding generation (key feature for storage savings)
    recompute: true

    # Graph construction parameters
    # Higher degree = better recall, more memory
    graph_degree: 32

    # Build complexity for index construction
    # Higher = better quality, slower build
    build_complexity: 64

    # Use compact storage (CSR format)
    # Reduces memory footprint
    compact: true

    # Backend algorithm
    # Options: hnsw (faster, more memory) | diskann (slower, less memory)
    backend: hnsw

    # ContextHelp integration: metadata fields to index
    metadata_fields:
      - tags          # Tag filtering in vector search
      - mentions      # Entity-based filtering
      - hints         # User hints
      - decisions     # Decision tracking
      - pipeline      # Pipeline metadata
      - created_at    # Temporal filtering
      - updated_at

# Ingestion and queue use in-memory or lightweight backends
ingestion:
  mode: jobs
  auto_start_worker: true

queue:
  backend: memory  # Lightweight queue for LEANN backend
  workers: 4
  retry_limit: 3

# Rest of configuration remains standard
pipelines:
  enabled:
    - text.short
    - text.long
    - url.generic
    - url.repo
    - image.ui
    - image.landing
  defaults:
    text: text.long
    url: url.generic
    image: image.landing

ai_providers:
  openai:
    key: ${OPENAI_API_KEY}
    model: gpt-4o

server:
  http:
    port: 7700
    public: false
  grpc:
    port: 7701

privacy:
  telemetry: false

################################################################################
