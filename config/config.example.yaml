# ContextHelp configuration template
#
# ctxt and dpkms read the same schema, each from its own file:
#
#   ctxt   ~/.config/contexthelp/ctxt.yaml    (client: which instance, profiles, capture, watch)
#   dpkms  ~/.config/contexthelp/dpkms.yaml   (daemon: ports, auth, storage, jobs, providers)
#
# Copy this file to either or both and enable what you need. As copied it
# sets nothing: every setting below is commented out. Each section says
# which binary acts on it; a binary ignores the keys its commands never use.
#
# A commented setting is '#' directly followed by its YAML ('#key: value',
# '#  nested: value'); remove the '#' to enable it. A comment with a space
# after '#' is prose. Values shown are the built-in defaults where a key has
# one; names, URLs and paths are examples.
#
# Config files never expand environment variable references: a value is
# used exactly as written. REPLACE_ME marks a secret: keep real secrets out of shared files
# (see docs/configuration-structure.md#secrets).
#
# Check a file after editing it:
#   ctxt config validate
#   CTXT_CONFIG=~/.config/contexthelp/dpkms.yaml ctxt config validate
#
# Reference: docs/configuration-structure.md, docs/environment-variables/,
# docs/manual/reference/config-and-permissions.md. Source of truth: the
# Config type in internal/config/config.go.

# Storage (both: dpkms serve, and ctxt commands that open the store).
# Paths are not ~-expanded: write them absolute.
#storage:
#  type: sqlite
# Base data directory: run/ (pidfiles, instance selection) and the default
# database and blob paths live under it. Default: $XDG_DATA_HOME/contexthelp.
# CTXT_DATA_DIR and dpkms --data-dir override it.
#  data_dir: /srv/contexthelp
# SQLite database file, or a PostgreSQL connection string when type is
# postgres. Default: <data_dir>/db.sqlite.
#  path: /srv/contexthelp/db.sqlite
#  blob:
# local | s3 | garage. Content larger than threshold bytes is stored here.
#    backend: local
#    threshold: 65536
#    local:
# Default: <data_dir>/blobs.
#      path: /srv/contexthelp/blobs
# s3 and garage need bucket; garage also needs endpoint. Credentials:
# CTXT_BLOB_S3_ACCESS_KEY / CTXT_BLOB_S3_SECRET_KEY.
#    s3:
#      endpoint: https://s3.example.net
#      region: us-east-1
#      bucket: contexthelp
#      prefix: ctxt/
#      use_path_style: false
#      presign_expiry: 1h
#      max_retries: 3

#server:
# --- dpkms serve (dpkms.yaml) ---
# Listener ports. Unset, serve prefers 8080 / 9090 / 9377 and moves off a
# busy one. A port set here (or by flag or env) is exact: serve exits when
# it is busy. 0 asks the OS for a free port.
#  port: 8080
#  grpc_port: 9090
#  cookie_bridge_port: 9377
#  workers: 4
#  reminder_interval: 1m
# CORS for the Vite dev server (http://localhost:5173).
#  dev: false
# private (loopback only) | protected (trusted network) | public. Every
# non-private instance needs server.auth or serve refuses to start.
#  access: private
#  auth:
# static is the only implemented provider.
#    provider: static
#    static:
#      tokens:
# Each token: at least 32 characters (openssl rand -hex 32), no REPLACE_ME,
# one or more roles of admin | writer | reader.
#        - token: REPLACE_ME
#          principal: laptop
#          roles: [admin]
# Extra Host header values to answer to (host, or host:port).
#  allowed_hosts:
#    - dpkms.lan
#    - dpkms.lan:8443
# Web UI browser sessions (ctxt ui open).
#  ui:
#    session:
#      idle_ttl: 12h
#      max_ttl: 168h
# Per-principal monthly caps on the entity-serving surface (non-private
# instances). event: entity_resolve | content_pull | taxonomy_sync.
#  quotas:
#    - principal: partner
#      event: entity_resolve
#      limit: 10000
#      warn_at: 8000
# --- clients (ctxt.yaml) ---
# The instance to talk to. urls wins over url; without --server, --instance,
# CTXT_INSTANCE or `ctxt instance use`, clients use the first entry only.
#  url: http://127.0.0.1:8080
#  urls:
#    - http://127.0.0.1:8080
#    - name: home
#      url: https://dpkms.example.net
#      token: REPLACE_ME
# Default bearer token for entries without their own.
#  token: REPLACE_ME

# Job worker pool (dpkms serve).
#jobs:
#  poll_interval: 500ms
#  stale_timeout: 30m
#  max_retries: 3
#  max_hops: 5
#  drain_timeout: 30s

# Providers (dpkms serve; ctxt for embeddings and direct-store commands).
# auto probes for a local tool and falls back to a stub. API keys come from
# the secrets store (dpkms secret set OPENAI_API_KEY) or the env var of the
# same name: OPENAI_API_KEY, ANTHROPIC_API_KEY, GEMINI_API_KEY, OPENROUTER_API_KEY.
#providers:
# auto | openai | anthropic | ollama | stub. auto picks Anthropic, then
# OpenAI, when a key is set, else Ollama at endpoint. Empty model: the
# backend's default (llama3, gpt-4o-mini, claude-haiku-4-5-20251001).
#  llm:
#    backend: auto
#    endpoint: http://localhost:11434
#    model: llama3
# auto | ollama | openai | anthropic | gemini | openrouter | stub
#  vision:
#    backend: auto
#    endpoint: http://localhost:11434
#    model: llava
# auto | golib | pdftotext | stub
#  document:
#    backend: auto
# auto | tesseract | stub. language: tesseract language code.
#  ocr:
#    backend: auto
#    language: eng
# auto | whisper-cli | ollama | stub
#  transcription:
#    backend: auto
# auto | ffmpeg | stub
#  video:
#    backend: auto
# auto | pyannote | stub
#  diarization:
#    backend: auto
# ollama | stub. CTXT_EMBEDDING_* env vars and --embedding-* flags win.
#  embedding:
#    backend: ollama
#    model: nomic-embed-text
#    endpoint: http://localhost:11434

