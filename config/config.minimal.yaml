# ContextHelp minimal configuration
#
# Nothing is required: with no config file at all, ctxt and dpkms run on
# their built-in defaults (SQLite under $XDG_DATA_HOME/contexthelp, dpkms
# serve on 127.0.0.1:8080, ctxt talking to it there). This file shows the
# few settings people change first. Copy it to
# ~/.config/contexthelp/ctxt.yaml and/or ~/.config/contexthelp/dpkms.yaml.
#
# As copied it sets nothing. A commented setting is '#' directly followed by
# its YAML; remove the '#' to enable it. Every key: config/config.example.yaml.
# Check the result with `ctxt config validate`.

#server:
# dpkms.yaml: job workers dpkms serve runs.
#  workers: 4
# ctxt.yaml: the instance ctxt talks to.
#  url: http://127.0.0.1:8080

# dpkms.yaml: LLM and embedding providers. auto uses a hosted LLM when its
# API key is set (ANTHROPIC_API_KEY, OPENAI_API_KEY), else local Ollama.
#providers:
#  llm:
#    backend: auto
#  embedding:
#    backend: ollama
#    model: nomic-embed-text
#    endpoint: http://localhost:11434

# ctxt.yaml: the default focus profile.
#profile:
#  default: personal
#  profiles:
#    personal:
#      description: Everything I capture
