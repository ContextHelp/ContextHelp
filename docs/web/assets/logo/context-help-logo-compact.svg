  <!-- Wordmark (centered vertically) -->
  <text x="64" y="31" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="24" font-weight="700" fill="#1a2332" letter-spacing="-0.02em">context.help</text>
