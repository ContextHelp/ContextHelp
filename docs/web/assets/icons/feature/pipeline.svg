<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" fill="none">
  <!-- Pipeline Icon - Flow Diagram -->

  <!-- Input stage -->
  <rect x="2" y="8" width="4" height="8" rx="2" stroke="#00d9ff" stroke-width="2"/>

  <!-- Arrow 1 -->
  <line x1="6" y1="12" x2="9" y2="12" stroke="#00d9ff" stroke-width="2"/>
  <polyline points="8,10.5 9.5,12 8,13.5" stroke="#00d9ff" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Processing stage -->
  <rect x="10" y="8" width="4" height="8" rx="2" stroke="#00d9ff" stroke-width="2"/>

  <!-- Arrow 2 -->
  <line x1="14" y1="12" x2="17" y2="12" stroke="#00d9ff" stroke-width="2"/>
  <polyline points="16,10.5 17.5,12 16,13.5" stroke="#00d9ff" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Output stage -->
  <rect x="18" y="8" width="4" height="8" rx="2" stroke="#00d9ff" stroke-width="2"/>
</svg>
