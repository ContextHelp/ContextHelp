<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" fill="none">
  <!-- Knowledge Graph Icon - Connected Nodes -->

  <!-- Connecting lines -->
  <line x1="12" y1="4" x2="12" y2="9" stroke="#3dd68c" stroke-width="2"/>
  <line x1="4" y1="12" x2="9" y2="12" stroke="#3dd68c" stroke-width="2"/>
  <line x1="20" y1="12" x2="15" y2="12" stroke="#3dd68c" stroke-width="2"/>
  <line x1="7" y1="18" x2="10" y2="14" stroke="#3dd68c" stroke-width="2"/>
  <line x1="17" y1="18" x2="14" y2="14" stroke="#3dd68c" stroke-width="2"/>

  <!-- Outer nodes -->
  <circle cx="12" cy="4" r="2" stroke="#3dd68c" stroke-width="2"/>
  <circle cx="4" cy="12" r="2" stroke="#3dd68c" stroke-width="2"/>
  <circle cx="20" cy="12" r="2" stroke="#3dd68c" stroke-width="2"/>
  <circle cx="7" cy="18" r="2" stroke="#3dd68c" stroke-width="2"/>
  <circle cx="17" cy="18" r="2" stroke="#3dd68c" stroke-width="2"/>

  <!-- Center node (filled) -->
  <circle cx="12" cy="12" r="3" fill="#3dd68c"/>
</svg>
