# NOT CURRENTLY LOADED. gosec's -conf flag parses this file as JSON, so a
# YAML config fails with "invalid character '#' looking for beginning of
# value" and the run exits 1 without scanning anything. Every setting below
# is therefore passed as a CLI flag in .github/workflows/ci.yml,
# .github/workflows/release.yml and the Makefile's gosec target instead.
#
# To make this file authoritative again, convert it to JSON (.gosec.json)
# and restore -conf. Until then, treat the flags as the source of truth and
# keep this file in step with them, or delete it.
#
# gosec configuration for ctxt / dPKMS
# See https://github.com/securego/gosec#configuration

global:
  # Fail on medium+ severity
  severity: medium
  confidence: medium
  # Show detailed findings
  show-ignored: false
  # Nosec annotation support
  nosec: true
  nosec-tag: "#nosec"

# Rule exclusions with rationale
exclude:
  # G104: Errors unhandled — covered by errcheck linter; avoid double-reporting
  - G104
  # G304: File path from variable — required for config/import flexibility;
  #       callers validate paths before use
  - G304
  # G307: Deferring a method which returns an error — well-known pattern;
  #       errors handled at close site
  - G307

# Per-path overrides
rules:
  # Test files: relax credential and file-path rules (test fixtures, not prod)
  - id: G101
    severity: low
    path: "_test\\.go$"
  - id: G304
    severity: low
    path: "_test\\.go$"

# Paths to exclude from scanning entirely
exclude-dir:
  - vendor
  - .git
  - docs
  - test/fixtures
