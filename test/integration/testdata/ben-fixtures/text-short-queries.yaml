  - id: q-capture-profile-note
    query: "ctxt capture profile note"
    expected_ids: [doc-capture-001]
  - id: q-capture-ambient
    query: "ambient capture clipboard mic"
    expected_ids: [doc-capture-002]
  - id: q-capture-offline-latency
    query: "ctxt add offline latency"
