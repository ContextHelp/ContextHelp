        {"jsonrpc":"2.0","id":1,"result":{"tools":[{"description":"Search the user's knowledge graph. Default mode \"hybrid\" combines full-text and semantic (embedding) search, so it matches both exact keywords — a person's name, project or company, topic, date, file path, a phrase the user used — and related wording. Other modes: \"fts\" (keywords only) and \"vector\" (meaning only). Returns ranked results with id, type, title, snippet and, for hybrid and vector, a score (hybrid adds a per-signal score_breakdown). When no embedding model is available, hybrid and vector answer from full-text search and say so in executed_mode and diagnostics.semantic.","inputSchema":{"properties":{"mentioned_since":{"description":"Only objects mentioning a date on or after this. YYYY-MM-DD.","format":"date","type":"string"},"mentioned_until":{"description":"Only objects mentioning a date on or before this. YYYY-MM-DD.","format":"date","type":"string"},"meta_type":{"description":"Only objects whose metadata type matches (e.g. task, observation).","type":"string"},"min_score":{"description":"hybrid only: drop results scoring below this. Default: 0.","minimum":0,"type":"number"},"mode":{"default":"hybrid","description":"hybrid (default), fts or vector.","enum":["hybrid","fts","vector"],"type":"string"},"person":{"description":"Only objects mentioning this person.","type":"string"},"profile":{"description":"Only return objects of this profile.","type":"string"},"query":{"description":"The search query: keywords or a phrase.","type":"string"},"since":{"description":"Only objects created at or after this; a date is the start of that UTC day. RFC 3339 timestamp or YYYY-MM-DD.","type":"string"},"source_type":{"description":"Only objects from this source type.","type":"string"},"tagged":{"description":"Only objects with these tags. A comma-separated string or an array of strings, combined in order. Plain tags are optional: with no + tag one listed tag must match; a leading + requires a tag (\"+a,+b,+c\" needs all three; \"+a,b,+c\" needs a and c, b only ranks). Results matching more of the listed tags rank first, then by relevance. Tags may hold spaces, commas separate them, case matters. An unknown tag matches nothing.","oneOf":[{"type":"string"},{"items":{"type":"string"},"type":"array"}]},"top_k":{"default":10,"description":"Maximum number of results to return. Default: 10.","maximum":100,"minimum":1,"type":"integer"},"topic":{"description":"Only objects tagged with this topic.","type":"string"},"until":{"description":"Only objects created before this; a date takes that whole UTC day. RFC 3339 timestamp or YYYY-MM-DD.","type":"string"}},"required":["query"],"type":"object"},"name":"search"},{"description":"Return the ctxt storage taxonomy: object kinds (text/url/image/audio/video/file/meeting), edge types, available pipelines, supported metadata fields. Use when constructing structured queries — rarely needed for direct lookups.","inputSchema":{"properties":{},"required":[],"type":"object"},"name":"schema"}]}}
