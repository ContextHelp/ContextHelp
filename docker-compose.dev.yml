version: '3.8'

# Docker Compose configuration for optional development services
# These services are NOT required for local development with SQLite
# Use them when testing Postgres, Redis, or Qdrant integrations

services:
  # PostgreSQL - Alternative storage backend
  postgres:
    image: postgres:16-alpine
    container_name: contexthelp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: contexthelp
      POSTGRES_PASSWORD: dev_password
      POSTGRES_DB: contexthelp
      POSTGRES_INITDB_ARGS: '--encoding=UTF8 --lc-collate=C --lc-ctype=C'
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./data/migrations:/docker-entrypoint-initdb.d/migrations:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U contexthelp"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - contexthelp

  # Redis - Distributed job queue and caching
  redis:
    image: redis:7-alpine
    container_name: contexthelp-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - contexthelp

  # Qdrant - Vector search database
  qdrant:
    image: qdrant/qdrant:v1.7.0
    container_name: contexthelp-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"  # REST API
      - "6334:6334"  # gRPC API
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      QDRANT__SERVICE__GRPC_PORT: 6334
      QDRANT__LOG_LEVEL: INFO
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - contexthelp

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  qdrant_data:
    driver: local

networks:
  contexthelp:
    driver: bridge
