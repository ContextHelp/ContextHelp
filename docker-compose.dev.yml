# Optional development side-services for testing non-default backends.
# Default ctxt dev flow uses SQLite + local job queue + sqlite-vec — these
# services are NOT required. Spin them up only when validating the
# Postgres storage backend.
#
# Usage:
#   docker compose -f docker-compose.dev.yml up postgres
#
# Network parity: the `ctxt` network is shared with docker-compose.yml so
# services started from either file can reach each other by service name.

services:
  # PostgreSQL — alternative storage backend. The pgvector-bundled image
  # is required: the driver's first migration is CREATE EXTENSION vector,
  # which plain postgres images cannot load.
  postgres:
    image: pgvector/pgvector:0.8.6-pg16-bookworm
    container_name: ctxt-postgres-dev
    restart: unless-stopped
    environment:
      POSTGRES_USER: ctxt
      POSTGRES_PASSWORD: ctxt
      POSTGRES_DB: ctxt
      POSTGRES_INITDB_ARGS: '--encoding=UTF8 --lc-collate=C --lc-ctype=C'
    ports:
      - "5432:5432"
    volumes:
      # No init scripts: the postgres driver applies its embedded
      # migrations on first connect.
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ctxt"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ctxt

volumes:
  postgres_data:
    driver: local

networks:
  ctxt:
    name: ctxt
    driver: bridge
    # external: true here would attach to docker-compose.yml's `ctxt`
    # network when both stacks are up. Compose auto-creates if absent;
    # we leave external out so this file works standalone too.
