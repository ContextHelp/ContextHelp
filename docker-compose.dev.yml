# Optional development side-services for testing non-default backends.
# Default ctxt dev flow uses SQLite + local job queue + sqlite-vec — these
# services are NOT required. Spin them up only when validating Postgres,
# Redis, or Qdrant integrations.
#
# Usage:
#   docker compose -f docker-compose.dev.yml up postgres
#   docker compose -f docker-compose.dev.yml up redis qdrant
#
# Network parity: the `ctxt` network is shared with docker-compose.yml so
# services started from either file can reach each other by service name.

services:
  # PostgreSQL — alternative storage backend
  postgres:
    image: postgres:16-alpine
    container_name: ctxt-postgres-dev
    restart: unless-stopped
    environment:
      POSTGRES_USER: ctxt
      POSTGRES_PASSWORD: ctxt
      POSTGRES_DB: ctxt
      POSTGRES_INITDB_ARGS: '--encoding=UTF8 --lc-collate=C --lc-ctype=C'
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./data/migrations:/docker-entrypoint-initdb.d/migrations:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ctxt"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ctxt

  # Redis — distributed job queue and caching
  redis:
    image: redis:7-alpine
    container_name: ctxt-redis-dev
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ctxt

  # Qdrant — vector search database
  qdrant:
    image: qdrant/qdrant:v1.7.0
    container_name: ctxt-qdrant-dev
    restart: unless-stopped
    ports:
      - "6333:6333"  # REST API
      - "6334:6334"  # gRPC API
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      QDRANT__SERVICE__GRPC_PORT: 6334
      QDRANT__LOG_LEVEL: INFO
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ctxt

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  qdrant_data:
    driver: local

networks:
  ctxt:
    name: ctxt
    driver: bridge
    # external: true here would attach to docker-compose.yml's `ctxt`
    # network when both stacks are up. Compose auto-creates if absent;
    # we leave external out so this file works standalone too.
