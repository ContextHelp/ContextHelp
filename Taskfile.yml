version: '3'

# Taskfile for ContextHelp
# Install: https://taskfile.dev/installation/
# Usage: task <command>

vars:
  BINARY_DPKMS: ./bin/dpkms
  BINARY_CTXT: ./bin/ctxt
  MAIN_DPKMS: ./cmd/dpkms
  MAIN_CTXT: ./cmd/ctxt
  DB_PATH: ./data/sqlite/contexthelp.db
  MIGRATION_PATH: ./data/migrations
  BUILD_TAGS: -tags fts5 -buildvcs=false

env:
  GO111MODULE: on
  CGO_ENABLED: 1

tasks:
  default:
    desc: Show available tasks
    cmds:
      - task --list

  check:
    desc: Run the primary local quality gate
    deps: [ci]

  # Development tasks
  dev:
    desc: Run development mode with hot reload
    deps: [build]
    cmds:
      - |
        echo "Starting ContextHelp in development mode..."
        trap 'kill 0' EXIT
        air -c .air.toml || go run {{.MAIN_DPKMS}} serve &
        sleep 2
        echo "Development server running. Press Ctrl+C to stop."
        wait

  run:dpkms:
    desc: Run dPKMS server
    deps: [build:dpkms]
    cmds:
      - "{{.BINARY_DPKMS}} serve"

  run:ctxt:
    desc: Run ctxt CLI (interactive)
    deps: [build:ctxt]
    cmds:
      - "{{.BINARY_CTXT}}"

  # Build tasks
  build:
    desc: Build both binaries
    deps: [build:dpkms, build:ctxt]

  build:dpkms:
    desc: Build dPKMS binary
    cmds:
      - mkdir -p bin
      - go build {{.BUILD_TAGS}} -v -o {{.BINARY_DPKMS}} {{.MAIN_DPKMS}}
    sources:
      - "{{.MAIN_DPKMS}}/**/*.go"
      - internal/dpkms/**/*.go
      - pkg/dpkms/**/*.go
    generates:
      - "{{.BINARY_DPKMS}}"

  build:ctxt:
    desc: Build ctxt binary
    cmds:
      - mkdir -p bin
      - go build {{.BUILD_TAGS}} -v -o {{.BINARY_CTXT}} {{.MAIN_CTXT}}
    sources:
      - "{{.MAIN_CTXT}}/**/*.go"
      - internal/ctxt/**/*.go
      - pkg/ctxt/**/*.go
    generates:
      - "{{.BINARY_CTXT}}"

  build:prod:
    desc: Build optimized production binaries
    cmds:
      - mkdir -p bin
      - |
        go build {{.BUILD_TAGS}} -v -ldflags="-s -w -X main.version={{.VERSION}} -X main.commit={{.COMMIT}}" \
          -o {{.BINARY_DPKMS}} {{.MAIN_DPKMS}}
      - |
        go build {{.BUILD_TAGS}} -v -ldflags="-s -w -X main.version={{.VERSION}} -X main.commit={{.COMMIT}}" \
          -o {{.BINARY_CTXT}} {{.MAIN_CTXT}}
    vars:
      VERSION:
        sh: git describe --tags --always --dirty
      COMMIT:
        sh: git rev-parse HEAD

  clean:
    desc: Clean build artifacts
    cmds:
      - rm -rf bin/
      - rm -rf dist/
      - go clean -cache -testcache -modcache

  # Testing tasks
  test:
    desc: Run all tests
    cmds:
      - go test {{.BUILD_TAGS}} -v -race -cover ./...

  test:unit:
    desc: Run unit tests only
    cmds:
      - go test {{.BUILD_TAGS}} -v -short -race -cover ./...

  test:integration:
    desc: Run integration tests
    cmds:
      - go test {{.BUILD_TAGS}} -v -race -tags=integration ./test/integration/...

  test:e2e:
    desc: Run focused end-to-end integration scenarios
    cmds:
      - go test {{.BUILD_TAGS}} -v -race ./test/integration -run '^Test(FullWritePath|FullReadPath|JobRetry|EdgesCreated|IngestThenSearch|ConcurrentIngestion|ObjectDeleteCascade)$'

  test:smoke:
    desc: Run binary smoke tests
    cmds:
      - go test {{.BUILD_TAGS}} -v -tags=smoke ./test/smoke/...

  test:coverage:
    desc: Generate test coverage report
    cmds:
      - go test {{.BUILD_TAGS}} -v -race -coverprofile=coverage.out -covermode=atomic ./...
      - go tool cover -html=coverage.out -o coverage.html
      - 'echo "Coverage report generated: coverage.html"'
      - go tool cover -func=coverage.out

  test:watch:
    desc: Run tests in watch mode
    cmds:
      - |
        echo "Watching for changes... Press Ctrl+C to stop."
        fswatch -o . -e ".*" -i "\\.go$" | xargs -n1 -I{} go test -short ./...

  test:race:
    desc: Run tests with race detector
    cmds:
      - go test {{.BUILD_TAGS}} -v -race ./...

  test:bench:
    desc: Run benchmarks
    cmds:
      - go test {{.BUILD_TAGS}} -v -bench=. -benchmem ./...

  # Code quality tasks
  lint:
    desc: Run linters
    cmds:
      - golangci-lint run --timeout=5m

  lint:fix:
    desc: Run linters and auto-fix issues
    cmds:
      - golangci-lint run --fix --timeout=5m

  fmt:
    desc: Format code
    cmds:
      - go fmt ./...
      - goimports -w -local github.com/ideacrafterslabs/contexthelp .

  vet:
    desc: Run go vet
    cmds:
      - go vet ./...

  security:
    desc: Run security scans
    cmds:
      - govulncheck ./...
      - gosec -quiet ./...

  # CI tasks (match GitHub Actions)
  ci:
    desc: Run all CI checks locally
    deps: [ci:lint, ci:security, ci:test, ci:build]

  ci:lint:
    desc: CI lint checks
    cmds:
      - task: lint
      - task: fmt
      - task: vet

  ci:security:
    desc: CI security checks
    cmds:
      - task: security

  ci:test:
    desc: CI test suite
    cmds:
      - task: test:unit
      - task: test:coverage

  ci:build:
    desc: CI build check
    cmds:
      - task: build

  # Database tasks
  db:migrate:up:
    desc: Run database migrations
    cmds:
      - migrate -path {{.MIGRATION_PATH}} -database "sqlite3://{{.DB_PATH}}" up

  db:migrate:down:
    desc: Rollback database migrations
    cmds:
      - migrate -path {{.MIGRATION_PATH}} -database "sqlite3://{{.DB_PATH}}" down 1

  db:migrate:create:
    desc: "Create new migration (usage: task db:migrate:create -- name)"
    cmds:
      - migrate create -ext sql -dir {{.MIGRATION_PATH}} -seq {{.CLI_ARGS}}

  db:reset:
    desc: Reset database (drop all tables and re-run migrations)
    cmds:
      - rm -f {{.DB_PATH}}
      - task: db:migrate:up

  db:seed:
    desc: Seed database with test data
    cmds:
      - go run ./scripts/seed.go

  # Docker tasks
  services:up:
    desc: Start Docker services (Postgres, Redis, Qdrant)
    cmds:
      - docker-compose -f docker-compose.dev.yml up -d
      - echo "Waiting for services to be ready..."
      - sleep 5
      - docker-compose -f docker-compose.dev.yml ps

  services:down:
    desc: Stop Docker services
    cmds:
      - docker-compose -f docker-compose.dev.yml down

  services:logs:
    desc: View Docker service logs
    cmds:
      - docker-compose -f docker-compose.dev.yml logs -f

  services:restart:
    desc: Restart Docker services
    cmds:
      - docker-compose -f docker-compose.dev.yml restart

  services:clean:
    desc: Stop services and remove volumes
    cmds:
      - docker-compose -f docker-compose.dev.yml down -v

  # Dependency tasks
  deps:
    desc: Download Go dependencies
    cmds:
      - go mod download
      - go mod tidy
      - go mod verify

  deps:update:
    desc: Update Go dependencies
    cmds:
      - go get -u ./...
      - go mod tidy

  deps:vendor:
    desc: Vendor dependencies
    cmds:
      - go mod vendor

  deps:install:
    desc: "Install ingestor dependencies by group (usage: task deps:install or task deps:install -- GROUP)"
    cmds:
      - |
        case "$(uname -s 2>/dev/null || echo Windows)" in
          Darwin)  task deps:install:unix -- {{.CLI_ARGS}} ;;
          Linux)   task deps:install:unix -- {{.CLI_ARGS}} ;;
          Windows*|MINGW*|MSYS*|CYGWIN*)
            echo "Windows detected — use: task deps:install:windows -- {{.CLI_ARGS}}"
            task deps:install:windows -- {{.CLI_ARGS}}
            ;;
          *) echo "Unknown OS — run task deps:install:unix or task deps:install:windows manually" ;;
        esac

  deps:install:unix:
    desc: "Install ingestor dependencies on macOS/Linux (usage: task deps:install:unix -- GROUP)"
    cmds:
      - |
        GROUP="{{.CLI_ARGS}}"
        GROUP="${GROUP:-all}"

        ok()  { printf '  ✓ %s\n' "$1"; }
        skip(){ printf '  - %s (already installed)\n' "$1"; }
        fail(){ printf '  ✗ %s — install failed\n' "$1"; }

        # ── detect package manager ─────────────────────────────────────────
        if command -v brew >/dev/null 2>&1; then
          PKG=brew
        elif command -v apt-get >/dev/null 2>&1; then
          PKG=apt
          sudo apt-get update -qq
        elif command -v dnf >/dev/null 2>&1; then
          PKG=dnf
        elif command -v pacman >/dev/null 2>&1; then
          PKG=pacman
        elif command -v zypper >/dev/null 2>&1; then
          PKG=zypper
        else
          echo "No supported package manager found (brew/apt/dnf/pacman/zypper)."
          echo "Install dependencies manually and re-run 'task preflight'."
          exit 1
        fi

        pkg_install() {
          # pkg_install <brew-pkg> <apt-pkg> <dnf-pkg> <pacman-pkg> <zypper-pkg> <bin-to-check> [label]
          local brew_p="$1" apt_p="$2" dnf_p="$3" pac_p="$4" zyp_p="$5" bin="$6" label="${7:-$6}"
          if command -v "$bin" >/dev/null 2>&1; then skip "$label"; return; fi
          case "$PKG" in
            brew)   brew install "$brew_p" && ok "$label" || fail "$label" ;;
            apt)    sudo apt-get install -y "$apt_p"   && ok "$label" || fail "$label" ;;
            dnf)    sudo dnf install -y "$dnf_p"       && ok "$label" || fail "$label" ;;
            pacman) sudo pacman -S --noconfirm "$pac_p" && ok "$label" || fail "$label" ;;
            zypper) sudo zypper install -y "$zyp_p"    && ok "$label" || fail "$label" ;;
          esac
        }
        cask_install() {
          # cask_install <brew-cask> <apt-pkg> <dnf-pkg> <pacman-pkg> <zypper-pkg> <bin-to-check> [label]
          local brew_c="$1" apt_p="$2" dnf_p="$3" pac_p="$4" zyp_p="$5" bin="$6" label="${7:-$6}"
          if command -v "$bin" >/dev/null 2>&1; then skip "$label"; return; fi
          case "$PKG" in
            brew)   brew install --cask "$brew_c"       && ok "$label" || fail "$label" ;;
            apt)    sudo apt-get install -y "$apt_p"    && ok "$label" || fail "$label" ;;
            dnf)    sudo dnf install -y "$dnf_p"        && ok "$label" || fail "$label" ;;
            pacman) sudo pacman -S --noconfirm "$pac_p"  && ok "$label" || fail "$label" ;;
            zypper) sudo zypper install -y "$zyp_p"     && ok "$label" || fail "$label" ;;
          esac
        }

        # ── ocr ────────────────────────────────────────────────────────────
        if [ "$GROUP" = all ] || [ "$GROUP" = ocr ]; then
          echo "▶ OCR"
          pkg_install tesseract tesseract-ocr tesseract tesseract tesseract tesseract
          case "$PKG" in
            brew)   brew install tesseract-lang && ok "tesseract-lang" || fail "tesseract-lang" ;;
            apt)    sudo apt-get install -y tesseract-ocr-all && ok "tesseract-lang" || fail "tesseract-lang" ;;
            dnf)    sudo dnf install -y tesseract-langpack-* 2>/dev/null; ok "tesseract-lang (best-effort)" ;;
            pacman) sudo pacman -S --noconfirm tesseract-data-eng 2>/dev/null; ok "tesseract-lang (eng)" ;;
            zypper) sudo zypper install -y tesseract-ocr-traineddata-english 2>/dev/null; ok "tesseract-lang (eng)" ;;
          esac
        fi

        # ── audio / transcription ──────────────────────────────────────────
        if [ "$GROUP" = all ] || [ "$GROUP" = audio ]; then
          echo "▶ Audio / Transcription"
          pkg_install ffmpeg ffmpeg ffmpeg ffmpeg ffmpeg ffmpeg
          if command -v whisper >/dev/null 2>&1 || command -v whisper-cpp >/dev/null 2>&1; then
            skip "whisper (already at $(command -v whisper 2>/dev/null || command -v whisper-cpp))"
          else
            echo "  ! whisper not found — install via:"
            case "$PKG" in
              brew)   echo "      brew install whisper-cpp  # or: pip install openai-whisper" ;;
              apt)    echo "      pip install openai-whisper" ;;
              dnf)    echo "      pip install openai-whisper" ;;
              pacman) echo "      yay -S whisper-cpp  # or: pip install openai-whisper" ;;
              zypper) echo "      pip install openai-whisper" ;;
            esac
          fi
        fi

        # ── diarization ────────────────────────────────────────────────────
        if [ "$GROUP" = all ] || [ "$GROUP" = diarization ]; then
          echo "▶ Diarization"
          if command -v pyannote-audio >/dev/null 2>&1 || command -v pyannote >/dev/null 2>&1; then
            skip "pyannote-audio (already installed)"
          else
            echo "  ! pyannote-audio not found — install via pip:"
            echo "      pip install pyannote.audio"
          fi
        fi

        # ── pdf ────────────────────────────────────────────────────────────
        if [ "$GROUP" = all ] || [ "$GROUP" = pdf ]; then
          echo "▶ PDF"
          pkg_install poppler poppler-utils poppler-utils poppler poppler-tools pdftotext "pdftotext (poppler)"
        fi

        # ── office ────────────────────────────────────────────────────────
        if [ "$GROUP" = all ] || [ "$GROUP" = office ]; then
          echo "▶ Office documents"
          cask_install libreoffice libreoffice libreoffice libreoffice libreoffice soffice "soffice (LibreOffice)"
        fi

        # ── markdown / docs ───────────────────────────────────────────────
        if [ "$GROUP" = all ] || [ "$GROUP" = markdown ]; then
          echo "▶ Markdown / Docs"
          pkg_install pandoc pandoc pandoc pandoc pandoc pandoc
        fi

        # ── go dev tools ──────────────────────────────────────────────────
        if [ "$GROUP" = all ] || [ "$GROUP" = gotools ]; then
          echo "▶ Go dev tools"
          go install github.com/golangci/golangci-lint/cmd/golangci-lint@latest && ok golangci-lint || fail golangci-lint
          go install golang.org/x/vuln/cmd/govulncheck@latest && ok govulncheck || fail govulncheck
          go install github.com/securego/gosec/v2/cmd/gosec@latest && ok gosec || fail gosec
          go install -tags 'sqlite3' github.com/golang-migrate/migrate/v4/cmd/migrate@latest && ok migrate || fail migrate
        fi

        echo ""
        echo "Done. Run 'task preflight' to verify."

  deps:install:windows:
    desc: "Install ingestor dependencies on Windows via winget/choco (usage: task deps:install:windows -- GROUP)"
    cmds:
      - |
        $Group = "{{.CLI_ARGS}}"
        if (-not $Group) { $Group = "all" }

        function ok($label)   { Write-Host "  OK  $label" -ForegroundColor Green }
        function skip($label) { Write-Host "  --  $label (already installed)" }
        function fail($label) { Write-Host "  XX  $label -- install failed" -ForegroundColor Red }

        # prefer winget; fall back to choco
        $usechoco = $false
        if (-not (Get-Command winget -ErrorAction SilentlyContinue)) {
          if (Get-Command choco -ErrorAction SilentlyContinue) {
            $usechoco = $true
          } else {
            Write-Host "Neither winget nor choco found."
            Write-Host "Install winget: https://aka.ms/winget-install"
            Write-Host "  or choco:  https://chocolatey.org/install"
            exit 1
          }
        }

        function pkg_install($winget_id, $choco_id, $bin, $label = $bin) {
          if (Get-Command $bin -ErrorAction SilentlyContinue) { skip $label; return }
          if ($usechoco) { choco install -y $choco_id && ok $label || fail $label }
          else           { winget install --id $winget_id -e --silent && ok $label || fail $label }
        }

        if ($Group -eq "all" -or $Group -eq "ocr") {
          Write-Host "▶ OCR"
          pkg_install "UB-Mannheim.TesseractOCR" "tesseract" "tesseract"
          Write-Host "  ! Language packs: install via Tesseract installer at https://github.com/UB-Mannheim/tesseract/wiki"
        }

        if ($Group -eq "all" -or $Group -eq "audio") {
          Write-Host "▶ Audio / Transcription"
          pkg_install "Gyan.FFmpeg" "ffmpeg" "ffmpeg"
          if (Get-Command whisper -ErrorAction SilentlyContinue) { skip "whisper" }
          elseif (Get-Command whisper-cpp -ErrorAction SilentlyContinue) { skip "whisper-cpp" }
          else {
            Write-Host "  ! whisper not found — install via:"
            Write-Host "      pip install openai-whisper"
          }
        }

        if ($Group -eq "all" -or $Group -eq "diarization") {
          Write-Host "▶ Diarization"
          if (Get-Command pyannote-audio -ErrorAction SilentlyContinue) { skip "pyannote-audio" }
          else {
            Write-Host "  ! pyannote-audio not found — install via pip:"
            Write-Host "      pip install pyannote.audio"
          }
        }

        if ($Group -eq "all" -or $Group -eq "pdf") {
          Write-Host "▶ PDF"
          pkg_install "freedesktop.Poppler" "poppler" "pdftotext" "pdftotext (poppler)"
        }

        if ($Group -eq "all" -or $Group -eq "office") {
          Write-Host "▶ Office documents"
          pkg_install "TheDocumentFoundation.LibreOffice" "libreoffice" "soffice" "soffice (LibreOffice)"
        }

        if ($Group -eq "all" -or $Group -eq "markdown") {
          Write-Host "▶ Markdown / Docs"
          pkg_install "JohnMacFarlane.Pandoc" "pandoc" "pandoc"
        }

        if ($Group -eq "all" -or $Group -eq "gotools") {
          Write-Host "▶ Go dev tools"
          go install github.com/golangci/golangci-lint/cmd/golangci-lint@latest && ok "golangci-lint" || fail "golangci-lint"
          go install golang.org/x/vuln/cmd/govulncheck@latest && ok "govulncheck" || fail "govulncheck"
          go install github.com/securego/gosec/v2/cmd/gosec@latest && ok "gosec" || fail "gosec"
          go install -tags sqlite3 github.com/golang-migrate/migrate/v4/cmd/migrate@latest && ok "migrate" || fail "migrate"
        }

        Write-Host ""
        Write-Host "Done. Run 'task preflight' to verify."
    platforms: [windows]

  preflight:
    desc: Check all ingestor deps and API keys are present (pre-flight)
    cmds:
      - |
        case "$(uname -s 2>/dev/null || echo Windows)" in
          Darwin|Linux) task preflight:unix ;;
          Windows*|MINGW*|MSYS*|CYGWIN*) task preflight:windows ;;
          *) task preflight:unix ;;
        esac

  preflight:unix:
    desc: Pre-flight check for macOS / Linux
    cmds:
      - |
        PASS=0; WARN=0; FAIL=0
        ok()   { printf '  ✓  %-30s %s\n' "$1" "${2:-}"; PASS=$((PASS+1)); }
        warn() { printf '  ⚠  %-30s %s\n' "$1" "${2:-}"; WARN=$((WARN+1)); }
        fail() { printf '  ✗  %-30s %s\n' "$1" "${2:-}"; FAIL=$((FAIL+1)); }
        check_bin() {
          local bin="$1"; local label="${2:-$1}"; local note="${3:-}"
          if p=$(command -v "$bin" 2>/dev/null); then ok "$label" "$p"
          else fail "$label" "${note:-not found}"; fi
        }
        check_env() {
          local var="$1"; local label="${2:-$var}"; local sev="${3:-warn}"
          if [ -n "${!var}" ]; then ok "$label" "(set)"
          elif [ "$sev" = fail ]; then fail "$label" "not set"
          else warn "$label" "not set — vision/llm pipelines may be limited"; fi
        }

        PATH="/opt/homebrew/bin:/usr/local/bin:$HOME/.local/bin:$PATH"

        echo "── Build tools ──────────────────────────────────────────────"
        check_bin go           "go"
        check_bin task         "task (taskfile)"
        check_bin golangci-lint "golangci-lint"
        check_bin govulncheck  "govulncheck"
        check_bin migrate      "migrate"

        echo "── OCR ──────────────────────────────────────────────────────"
        check_bin tesseract    "tesseract"

        echo "── Audio / Transcription ────────────────────────────────────"
        check_bin ffmpeg       "ffmpeg"
        check_bin ffprobe      "ffprobe"
        if command -v whisper >/dev/null 2>&1; then
          ok "whisper" "$(command -v whisper)"
        elif command -v whisper-cpp >/dev/null 2>&1; then
          ok "whisper-cpp" "$(command -v whisper-cpp)"
        else
          fail "whisper / whisper-cpp" "required for audio transcription"
        fi

        echo "── Diarization ──────────────────────────────────────────────"
        if command -v pyannote-audio >/dev/null 2>&1; then
          ok "pyannote-audio" "$(command -v pyannote-audio)"
        elif command -v pyannote >/dev/null 2>&1; then
          ok "pyannote" "$(command -v pyannote)"
        else
          warn "pyannote-audio" "not found — diarization pipeline disabled"
        fi

        echo "── PDF ──────────────────────────────────────────────────────"
        check_bin pdftotext    "pdftotext (poppler)"

        echo "── Office documents ─────────────────────────────────────────"
        if command -v soffice >/dev/null 2>&1; then
          ok "soffice (LibreOffice)" "$(command -v soffice)"
        else
          warn "soffice (LibreOffice)" "not found — Office doc pipeline disabled (task deps:install -- office)"
        fi

        echo "── Markdown / Docs ──────────────────────────────────────────"
        check_bin pandoc       "pandoc"

        echo "── API keys (vision / LLM) ──────────────────────────────────"
        check_env OPENAI_API_KEY      "OPENAI_API_KEY"
        check_env ANTHROPIC_API_KEY   "ANTHROPIC_API_KEY"
        check_env GEMINI_API_KEY      "GEMINI_API_KEY"
        check_env OPENROUTER_API_KEY  "OPENROUTER_API_KEY"
        if command -v ollama >/dev/null 2>&1; then
          ok "ollama (local vision/LLM)" "$(command -v ollama)"
        else
          warn "ollama" "not found — local vision/LLM unavailable"
        fi

        echo ""
        echo "Result: ${PASS} ok  ${WARN} warnings  ${FAIL} failures"
        [ "$FAIL" -eq 0 ] || exit 1

  preflight:windows:
    desc: Pre-flight check for Windows
    cmds:
      - |
        $pass = 0; $warn = 0; $fail = 0
        function ok($label, $path = "")   { Write-Host ("  OK  {0,-30} {1}" -f $label, $path) -ForegroundColor Green;   $script:pass++ }
        function warn($label, $note = "") { Write-Host ("  !!  {0,-30} {1}" -f $label, $note) -ForegroundColor Yellow;  $script:warn++ }
        function fail($label, $note = "") { Write-Host ("  XX  {0,-30} {1}" -f $label, $note) -ForegroundColor Red;     $script:fail++ }

        function check_bin($bin, $label = $bin, $note = "not found") {
          $p = Get-Command $bin -ErrorAction SilentlyContinue
          if ($p) { ok $label $p.Source } else { fail $label $note }
        }
        function check_env($var, $label = $var, $sev = "warn") {
          $val = [System.Environment]::GetEnvironmentVariable($var)
          if ($val) { ok $label "(set)" }
          elseif ($sev -eq "fail") { fail $label "not set" }
          else { warn $label "not set — vision/llm pipelines may be limited" }
        }

        Write-Host "── Build tools ──────────────────────────────────────────────"
        check_bin go
        check_bin task "task (taskfile)"
        check_bin golangci-lint
        check_bin govulncheck
        check_bin migrate

        Write-Host "── OCR ──────────────────────────────────────────────────────"
        check_bin tesseract

        Write-Host "── Audio / Transcription ────────────────────────────────────"
        check_bin ffmpeg
        check_bin ffprobe
        if (Get-Command whisper -ErrorAction SilentlyContinue) { ok "whisper" }
        elseif (Get-Command whisper-cpp -ErrorAction SilentlyContinue) { ok "whisper-cpp" }
        else { fail "whisper / whisper-cpp" "required for audio transcription" }

        Write-Host "── Diarization ──────────────────────────────────────────────"
        if (Get-Command pyannote-audio -ErrorAction SilentlyContinue) { ok "pyannote-audio" }
        elseif (Get-Command pyannote -ErrorAction SilentlyContinue) { ok "pyannote" }
        else { warn "pyannote-audio" "not found — diarization pipeline disabled" }

        Write-Host "── PDF ──────────────────────────────────────────────────────"
        check_bin pdftotext "pdftotext (poppler)"

        Write-Host "── Office documents ─────────────────────────────────────────"
        if (Get-Command soffice -ErrorAction SilentlyContinue) { ok "soffice (LibreOffice)" }
        else { warn "soffice (LibreOffice)" "not found — Office doc pipeline disabled (task deps:install -- office)" }

        Write-Host "── Markdown / Docs ──────────────────────────────────────────"
        check_bin pandoc

        Write-Host "── API keys (vision / LLM) ──────────────────────────────────"
        check_env OPENAI_API_KEY
        check_env ANTHROPIC_API_KEY
        check_env GEMINI_API_KEY
        check_env OPENROUTER_API_KEY
        if (Get-Command ollama -ErrorAction SilentlyContinue) { ok "ollama (local vision/LLM)" }
        else { warn "ollama" "not found — local vision/LLM unavailable" }

        Write-Host ""
        Write-Host "Result: $pass ok  $warn warnings  $fail failures"
        if ($fail -gt 0) { exit 1 }
    platforms: [windows]

  # Installation tasks
  install:
    desc: Install binaries to GOPATH
    deps: [build]
    cmds:
      - go install {{.BUILD_TAGS}} {{.MAIN_DPKMS}}
      - go install {{.BUILD_TAGS}} {{.MAIN_CTXT}}
      - echo "Binaries installed to $(go env GOPATH)/bin"

  install:tools:
    desc: Install development tools
    cmds:
      - go install github.com/golangci/golangci-lint/cmd/golangci-lint@latest
      - go install github.com/go-task/task/v3/cmd/task@latest
      - go install -tags 'sqlite3' github.com/golang-migrate/migrate/v4/cmd/migrate@latest
      - go install golang.org/x/vuln/cmd/govulncheck@latest
      - go install github.com/securego/gosec/v2/cmd/gosec@latest
      - echo "Development tools installed"

  # Documentation tasks
  docs:serve:
    desc: Serve documentation locally
    cmds:
      - |
        if command -v mdbook >/dev/null 2>&1; then
          cd docs && mdbook serve
        else
          echo "mdbook not installed. Serving with Python..."
          cd docs && python3 -m http.server 8000
        fi

  docs:build:
    desc: Build documentation
    cmds:
      - |
        if command -v mdbook >/dev/null 2>&1; then
          cd docs && mdbook build
        else
          echo "mdbook not installed. Skipping build."
        fi

  # Release tasks
  release:prepare:
    desc: Prepare release (update version, changelog)
    cmds:
      - echo "Preparing release..."
      - git describe --tags --abbrev=0 || echo "No tags found"
      - echo "Update CHANGELOG.md and version files"
      - "echo \"Then run: git tag -a v0.x.0 -m 'Release v0.x.0'\""

  release:build:
    desc: Build release artifacts
    deps: [build:prod]
    cmds:
      - mkdir -p dist
      - tar -czf dist/contexthelp-$(git describe --tags).tar.gz -C bin .
      - echo "Release artifacts created in dist/"

  # Utility tasks
  version:
    desc: Show version information
    cmds:
      - 'echo "Git tag: $(git describe --tags --always --dirty)"'
      - 'echo "Git commit: $(git rev-parse HEAD)"'
      - 'echo "Go version: $(go version)"'

  verify:
    desc: Verify installation
    cmds:
      - echo "=== Verifying installation ==="
      - go version
      - task --version || echo "Task not found"
      - golangci-lint --version || echo "golangci-lint not found"
      - migrate -version || echo "migrate not found"
      - govulncheck -version || echo "govulncheck not found"
      - echo "=== Database ==="
      - 'ls -lh {{.DB_PATH}} || echo "Database not found (run: task db:migrate:up)"'
      - echo "=== Binaries ==="
      - 'ls -lh bin/ || echo "Binaries not found (run: task build)"'
