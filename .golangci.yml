version: "2"
run:
  build-tags:
    - integration
    - e2e
    - fts5
    - watch_e2e
  modules-download-mode: readonly
  tests: true
linters:
  enable:
    - bodyclose
    - dupl
    - errorlint
    - forbidigo
    - goconst
    - gocritic
    - gocyclo
    - gosec
    - misspell
    - nilerr
    - noctx
    - prealloc
    - revive
    - rowserrcheck
    - sqlclosecheck
    - unconvert
    - unparam
  disable:
    - exhaustive
    - funlen
    - lll
    - mnd
    - nlreturn
    - wsl
  settings:
    errcheck:
      check-type-assertions: true
      # check-blank is off: `_ = f.Close()` is the idiom Go uses to document a
      # deliberately suppressed error, so flagging it punishes the explicit
      # form and rewards the silent bare call.
      exclude-functions:
        - (io.Closer).Close
        - (net/http.ResponseWriter).Write
        - fmt.Fprintf
        - fmt.Fprintln
        - fmt.Fprint
        - github.com/spf13/viper.BindPFlag
        - (*database/sql.Rows).Close
        - (*database/sql.DB).Close
        - (database/sql/driver.Conn).Close
        - (*database/sql.Tx).Rollback
        - (*os.File).Close
        - os.Remove
        - os.RemoveAll
    forbidigo:
      # ADR-080 §4: request handlers read through the viewer-scoped
      # driver (Service.Store(ctx)); only the pipeline, jobs and
      # housekeeping may name the raw driver, and they do so through
      # storage.System. The patterns are type-aware and
      # package-qualified so an import alias or an unrelated package
      # with a System function cannot dodge or trip them. Scoped to
      # internal/server, internal/mcp and internal/service by the
      # path-except exclusion below; the three ways left to read past
      # the scoped driver from those packages are each banned.
      analyze-types: true
      forbid:
        - pattern: ^storage\.System$
          pkg: ^github\.com/ideacrafterslabs/ctxt/internal/storage$
          msg: handlers take the viewer-scoped driver; storage.System is for pipeline, jobs and housekeeping (ADR-080 §4)
        # jobs.Queue holds the raw job store; its reads bypass the
        # scoped driver. Reads go through Service.GetJob / ListJobs.
        - pattern: ^jobs\.Queue\.(Get|List)$
          pkg: ^github\.com/ideacrafterslabs/ctxt/internal/jobs$
          msg: job reads go through the viewer-scoped driver (Service.GetJob, ListJobs), never the queue (ADR-080 §4)
        # A handler that attaches Unrestricted itself grants every
        # caller the owner's view. Only the transports' attach sites
        # (excluded below) may name it.
        - pattern: ^sharing\.Unrestricted$
          pkg: ^github\.com/ideacrafterslabs/ctxt/internal/sharing$
          msg: handlers never choose a viewer; the transport attaches it after authentication (ADR-080 §4)
    goconst:
      min-len: 3
      min-occurrences: 3
    gocritic:
      disabled-checks:
        - commentFormatting
      # diagnostic only. The style and performance tags cost ~6m of analyzer
      # time against a 5m CI budget, and their headline fix (hugeParam, pass
      # by pointer) changes aliasing semantics — a real bug risk traded for a
      # style opinion.
      enabled-tags:
        - diagnostic
    gocyclo:
      # 15 is tight for command files that dispatch on many flags: the
      # median flagged function here sits at 19 and the distribution is
      # continuous, so a threshold of 15 mostly reports "this is a CLI
      # entry point". 20 keeps the genuinely tangled ones (24 functions,
      # up to complexity 37) and stops reporting the other 53.
      min-complexity: 20
    gosec:
      excludes:
        - G104
        - G304
        - G307
      severity: medium
      confidence: medium
    govet:
      enable-all: true
      # fieldalignment wants struct fields reordered to save padding. Outside
      # hot paths that buys nothing and finds no bugs, while fighting field
      # orders chosen to group related data.
      disable:
        - fieldalignment
        - shadow
    misspell:
      locale: US
      # The codebase is consistently British-English by authorship, so these
      # are the house spelling rather than typos. Correcting them is not a
      # config change: misspell --fix rewrites identifier declarations without
      # their call sites and breaks the build.
      #
      # Entries match whole words, not stems, so every inflected form that
      # actually occurs is listed. Genuine typos (deliberatley, promots) are
      # deliberately absent so they stay reported.
      ignore-rules:
        - contexthelp
        - dpkms
        - analyse
        - analysed
        - analyses
        - artefact
        - authorise
        - behaviour
        - cancelled
        - cancelling
        - centralised
        - centralises
        - centred
        - colour
        - customising
        - defence
        - destabilise
        - favour
        - finalises
        - flavoured
        - honour
        - honouring
        - honours
        - initialise
        - initialised
        - initialises
        - labelled
        - localise
        - localised
        - marshalled
        - marshalling
        - materialise
        - minimises
        - modelling
        - neighbour
        - neighbours
        - neutralises
        - organisation
        - recognisable
        - recognise
        - recognised
        - recognises
        - sanitise
        - sanitised
        - serialise
        - serialised
        - serialises
        - signalling
        - summarise
        - summarised
        - summarises
        - unrecognised
    prealloc:
      simple: true
      range-loops: true
      for-loops: false
    revive:
      # The `exported` rule is omitted: it accounted for 915 of revive's 996
      # findings, and satisfying it yields `// Foo does foo.` filler rather
      # than documentation anyone benefits from reading.
      rules:
        - name: package-comments
        - name: var-naming
        - name: indent-error-flow
        - name: error-return
        - name: error-strings
        - name: receiver-naming
        - name: increment-decrement
        - name: error-naming
        - name: context-as-argument
        - name: context-keys-type
  exclusions:
    generated: lax
    rules:
      # Test files answer to different rules than production code. An
      # http.Get in a table-driven test against httptest.NewServer is not the
      # defect noctx exists to catch, and a body left unclosed in a test that
      # exits in milliseconds is not a leak.
      - linters:
          - dupl
          - goconst
          - gosec
          - noctx
          - bodyclose
          - errcheck
          - prealloc
          - unparam
        path: _test\.go
      - linters:
          - all
        path: (.*)/generated/(.*)\.go
      # ADR-080 §4: the raw-driver ban applies to request handlers and
      # the service they read through. Everywhere else storage.System
      # is the sanctioned way to name the unscoped driver, so its
      # findings are dropped outside internal/server, internal/mcp and
      # internal/service.
      - linters:
          - forbidigo
        path-except: ^internal/(server|mcp|service)/
      # The transports attach the viewer after authentication, and the
      # private access class and the watch ingester act as the owner by
      # design: those files are the only places sharing.Unrestricted is
      # named under the banned paths. Tests act as the owner freely.
      - linters:
          - forbidigo
        path: ^internal/server/(http/(server|middleware_auth)|grpc/(server|auth)|stack/watch_ingest)\.go$
        text: sharing\.Unrestricted
      - linters:
          - forbidigo
        path: (_test\.go|^internal/service/servicetest/)
        text: (sharing\.Unrestricted|\.Queue\.(Get|List))
      - linters:
          - gocyclo
        path: cmd/
      - path: _test\.go
        text: 'G101:'
    paths:
      - third_party$
      - builtin$
      - examples$
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
formatters:
  enable:
    - gofmt
    - goimports
  settings:
    gofmt:
      simplify: true
    # goimports has no local-prefixes: the key read
    # github.com/ideacrafterslabs/contexthelp, which matches nothing now the
    # module is .../ctxt, so it was inert. Dropping it records that no local
    # import grouping is enforced; setting it correctly would regroup imports
    # across 405 files.
    goimports: {}
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
