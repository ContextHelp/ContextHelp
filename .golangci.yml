version: "2"
run:
  build-tags:
    - integration
    - e2e
  modules-download-mode: readonly
  tests: true
linters:
  enable:
    - bodyclose
    - dupl
    - errorlint
    - goconst
    - gocritic
    - gocyclo
    - gosec
    - misspell
    - nilerr
    - noctx
    - prealloc
    - revive
    - rowserrcheck
    - sqlclosecheck
    - unconvert
    - unparam
  disable:
    - exhaustive
    - funlen
    - lll
    - mnd
    - nlreturn
    - wsl
  settings:
    errcheck:
      check-type-assertions: true
      check-blank: true
      exclude-functions:
        - (io.Closer).Close
        - (net/http.ResponseWriter).Write
    goconst:
      min-len: 3
      min-occurrences: 3
    gocritic:
      disabled-checks:
        - commentFormatting
        - whyNoLint
      enabled-tags:
        - diagnostic
        - style
        - performance
    gocyclo:
      min-complexity: 15
    gosec:
      excludes:
        - G104
        - G304
        - G307
      severity: medium
      confidence: medium
    govet:
      enable-all: true
    misspell:
      locale: US
      ignore-rules:
        - contexthelp
        - dpkms
    prealloc:
      simple: true
      range-loops: true
      for-loops: true
    revive:
      rules:
        - name: exported
          arguments:
            - checkPrivateReceivers
            - sayRepetitiveInsteadOfStutters
        - name: package-comments
        - name: var-naming
        - name: indent-error-flow
        - name: error-return
        - name: error-strings
        - name: receiver-naming
        - name: increment-decrement
        - name: error-naming
        - name: context-as-argument
        - name: context-keys-type
  exclusions:
    generated: lax
    rules:
      - linters:
          - dupl
          - goconst
          - gosec
        path: _test\.go
      - linters:
          - all
        path: (.*)/generated/(.*)\.go
      - linters:
          - gocyclo
        path: cmd/
      - path: _test\.go
        text: 'G101:'
    paths:
      - third_party$
      - builtin$
      - examples$
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
formatters:
  enable:
    - gofmt
    - goimports
  settings:
    gofmt:
      simplify: true
    goimports:
      local-prefixes:
        - github.com/ideacrafterslabs/contexthelp
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
